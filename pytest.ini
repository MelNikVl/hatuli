[pytest]
markers =
    live_data: тест по смыслу проверяет РЕАЛЬНЫЕ, конкретные записи прод-БД
        (не воспроизводится синтетическим seed без риска перестать
        проверять то, ради чего тест написан — обычно калибровка на
        живых данных, "не выдуманные числа"). CI (.github/workflows/ci.yml)
        гоняет только `-m "not live_data"`: GitHub-hosted раннер физически
        не может достучаться до Postgres на домашнем сервере (localhost
        там — не то же самое, что localhost здесь), поднимать себе
        доступ в интернет ради этого — не в этой задаче (self-hosted
        runner исключён явно, задача 2026-08-16, "P0 — Integrity").
        Прогон: venv/bin/pytest -m live_data -v (только локально, с
        реальным DATABASE_URL).
