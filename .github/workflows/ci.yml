# Минимальный CI (задача 2026-08-16, "P0 — Integrity", Блок 2) — до этой
# задачи на GitHub стояло 0 status checks: любой push мог сломать
# production-схему незамеченным (не абстрактный риск — миграции 076-078/
# 080/082 этой же задачи нашли 55 таблиц + 44 колонки, которые годами
# жили в обход migrations/, и их бы этот CI поймал на первом же PR).
#
# GitHub-hosted раннер (ubuntu-latest), НЕ self-hosted — тот же прод-сервер
# не должен исполнять код чужих PR. CD/environments/деплой — сознательно
# НЕ здесь, отдельная задача.
#
# Postgres — service container (эфемерный, живёт только внутри одного
# прогона job) — TEST_DB_* через secrets с фолбэком на дефолты: если в
# репо не заведены секреты, CI всё равно работает "из коробки" (что и
# нужно для самого первого запуска), а секреты — способ переопределить
# при необходимости (напр. другое имя тестовой БД).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# ВАЖНО: TEST_DB_USER обязан остаться "krisha" (или совпадать с ним),
# если его переопределять секретом — десятки migrations/*.sql
# заканчиваются жёстко прописанным "GRANT ... TO krisha" (роль-получатель
# — буквальная строка, не переменная). Grant самому себе — не ошибка
# (Postgres это разрешает), но ЛЮБОЕ другое имя роли уронит apply
# InsufficientPrivilegeError ("must be able to SET ROLE krisha") —
# проверено эмпирически при подготовке этого workflow.
env:
  TEST_DB_HOST: ${{ secrets.TEST_DB_HOST || 'localhost' }}
  TEST_DB_USER: ${{ secrets.TEST_DB_USER || 'krisha' }}
  TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'krisha_ci_pw' }}
  TEST_DB_NAME: ${{ secrets.TEST_DB_NAME || 'hatuli_test' }}

jobs:
  test:
    runs-on: ubuntu-latest

    # ПРАВКА (первый прогон 2026-08-16 был красным ДО старта единственного
    # job — "Invalid workflow file: Unrecognized named-value: 'env'"):
    # контекст `env` НЕДОСТУПЕН внутри блоков `env:` вообще нигде (ни в
    # services.*.env, ни в jobs.*.env) — только в шагах (run/with/if).
    # services.postgres.env ниже поэтому повторяет secrets-с-фолбэком
    # напрямую (не через `env.TEST_DB_USER`), а DATABASE_URL вообще не
    # блок env:, а отдельный шаг "Compose DATABASE_URL" (см. ниже) —
    # $GITHUB_ENV, стандартный способ прокинуть вычисленное значение в
    # последующие шаги, там ограничения на `env`-контекст нет.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER || 'krisha' }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'krisha_ci_pw' }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME || 'hatuli_test' }}
        ports:
          - 5432:5432
        # pg_isready — ждём готовности контейнера перед миграциями, не
        # полагаемся на "порт уже слушает = БД уже принимает запросы".
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compose DATABASE_URL
        run: echo "DATABASE_URL=postgresql://$TEST_DB_USER:$TEST_DB_PASSWORD@$TEST_DB_HOST:5432/$TEST_DB_NAME" >> "$GITHUB_ENV"

      - name: Apply all migrations from scratch (тот же механизм, что прод)
        run: |
          python -c "
          import asyncio, os
          from bot.db.pg import init_pool, close_pool

          async def main():
              await init_pool(os.environ['DATABASE_URL'])
              print('migrations applied OK')
              await close_pool()

          asyncio.run(main())
          "

      # ИСТОРИЯ (задача 2026-08-16, "P0 — Integrity", закрытие --deselect):
      # изначально здесь стоял список из 10 --deselect (см. git-историю
      # этого файла) — временная затычка, назначенная "кладбищем тестов".
      # Разобраны по одному:
      #   - 2 были РЕАЛЬНЫМИ БАГАМИ, замаскированными объёмом данных на
      #     dev-БД (bot/core/archive_check.py::_select_candidates — backlog
      #     не исключал уже отобранные cold_confirm id; apartment_listings.
      #     score_total — DEFAULT 0 в 000_core_tables.sql расходился с
      #     продом, migrations/082_score_total_no_default.sql) — исправлены
      #     в коде/миграции, тесты снова в общем прогоне ниже.
      #   - 5 требовали не конкретных ПРОДОВЫХ строк, а вообще ЛЮБЫХ
      #     синтетических (housing_class-модели — обучающая выборка;
      #     entity_resolution record_link — любые 2 complex_id) — получили
      #     свои seed-фикстуры, тоже снова в общем прогоне.
      #   - 3 (Family Nest/Tandau, tests/test_entity_resolution_phase.py)
      #     остаются live-only — калибровка на КОНКРЕТНЫХ исторических
      #     находках (docs/entity_resolution_plan.md), не воспроизводимая
      #     синтетикой без риска перестать защищать то, ради чего написана
      #     (см. докстринг файла). Помечены @pytest.mark.live_data
      #     (регистрация — pytest.ini) — `-m "not live_data"` ниже, а не
      #     хардкод трёх имён: новый live-only тест просто получает тот же
      #     маркер, без правки этого workflow. GitHub-hosted раннер (ЭТОТ
      #     job) не self-hosted и не может достучаться до Postgres на
      #     домашнем сервере — не "отдельный CI-job", который переносил бы
      #     эти 3 теста в CI, а честно НЕ в CI вовсе, только
      #     `venv/bin/pytest -m live_data` локально/руками.
      #
      # ПРАВКА (второй прогон, 9ef8411, был красным на этом шаге — pytest
      # exit 2, "Interrupted: 1 error during collection"): голый `pytest`
      # без пути сканирует ВЕСЬ корень репозитория, не только tests/ — и
      # цепляет test_server_search.py (ручной diagnostic-скрипт "Test if
      # DuckDuckGo search works from the server", НЕ тест, просто случайно
      # назван с префиксом test_), который импортирует ddgs — пакет, не
      # объявленный в requirements.txt (локально работал только потому,
      # что случайно стоял в персональном venv). Явный путь `tests/` ниже
      # — тот же скоуп, что использовался ВЕСЬ этот проход задачи (везде
      # "634 passed" в этой сессии — от `pytest tests/`, не голого pytest).
      # test_server_search.py не переименовывал/не трогал — не в рамках
      # "минимальный CI", отдельная мелкая находка.
      - name: pytest (полный suite, без параллельных флагов)
        run: pytest tests/ -q --tb=short -m "not live_data"

      - name: Import smoke test
        run: |
          python -c "
          from bot.core import location_score
          # reviews_pipeline.py/sentiment_analyzer.py — корневые скрипты
          # (тот же паттерн, что 2gis_reviews_collect.py/outcome_labels_
          # recompute.py и т.д.), НЕ пакет bot.reviews — такого пакета в
          # проекте нет, 'from bot.reviews import ...' привёл бы к
          # ModuleNotFoundError на КАЖДОМ прогоне.
          import reviews_pipeline
          import sentiment_analyzer
          print('imports OK')
          "
