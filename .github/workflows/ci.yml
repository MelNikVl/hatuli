# Минимальный CI (задача 2026-08-16, "P0 — Integrity", Блок 2) — до этой
# задачи на GitHub стояло 0 status checks: любой push мог сломать
# production-схему незамеченным (не абстрактный риск — миграции 076-078/
# 080/082 этой же задачи нашли 55 таблиц + 44 колонки, которые годами
# жили в обход migrations/, и их бы этот CI поймал на первом же PR).
#
# GitHub-hosted раннер (ubuntu-latest), НЕ self-hosted — тот же прод-сервер
# не должен исполнять код чужих PR. CD/environments/деплой — сознательно
# НЕ здесь, отдельная задача.
#
# Postgres — service container (эфемерный, живёт только внутри одного
# прогона job) — TEST_DB_* через secrets с фолбэком на дефолты: если в
# репо не заведены секреты, CI всё равно работает "из коробки" (что и
# нужно для самого первого запуска), а секреты — способ переопределить
# при необходимости (напр. другое имя тестовой БД).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# ВАЖНО: TEST_DB_USER обязан остаться "krisha" (или совпадать с ним),
# если его переопределять секретом — десятки migrations/*.sql
# заканчиваются жёстко прописанным "GRANT ... TO krisha" (роль-получатель
# — буквальная строка, не переменная). Grant самому себе — не ошибка
# (Postgres это разрешает), но ЛЮБОЕ другое имя роли уронит apply
# InsufficientPrivilegeError ("must be able to SET ROLE krisha") —
# проверено эмпирически при подготовке этого workflow.
env:
  TEST_DB_HOST: ${{ secrets.TEST_DB_HOST || 'localhost' }}
  TEST_DB_USER: ${{ secrets.TEST_DB_USER || 'krisha' }}
  TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'krisha_ci_pw' }}
  TEST_DB_NAME: ${{ secrets.TEST_DB_NAME || 'hatuli_test' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - 5432:5432
        # pg_isready — ждём готовности контейнера перед миграциями, не
        # полагаемся на "порт уже слушает = БД уже принимает запросы".
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://${{ env.TEST_DB_USER }}:${{ env.TEST_DB_PASSWORD }}@${{ env.TEST_DB_HOST }}:5432/${{ env.TEST_DB_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply all migrations from scratch (тот же механизм, что прод)
        run: |
          python -c "
          import asyncio
          from bot.db.pg import init_pool, close_pool

          async def main():
              await init_pool('${{ env.DATABASE_URL }}')
              print('migrations applied OK')
              await close_pool()

          asyncio.run(main())
          "

      # 10 тестов из 634 намеренно исключены ТОЛЬКО здесь (файлы тестов НЕ
      # трогали — на рабочей БД с реальными данными они как проходили, так
      # и проходят, 634/634). 9 из 10 сами документируют в assert-сообщении/
      # докстринге, что требуют конкретные строки живого прода (напр.
      # "фикстура предполагает id=3743 'Family Nest' в БД", "~2097
      # complexes" для housing_class-модели) — данные, не структура.
      #
      # test_as_of_backtest_does_not_write_to_db — ИНОЕ по природе: ловит
      # реальное расхождение схемы (apartment_listings.score_total имеет
      # DEFAULT 0 в migrations/000_core_tables.sql, но НЕ имеет default на
      # проде — там NULL до первого скоринга) — синтетическая вставка
      # получает 0 вместо ожидаемого NULL. Потенциально чинится одной
      # строкой (ALTER COLUMN score_total DROP DEFAULT), но это уже другой
      # класс дрейфа (значение по умолчанию, не отсутствие таблицы/
      # колонки) — сознательно вне этого блока (baseline закрывал именно
      # "таблица/колонка не существует", не "default не совпадает").
      #
      # Проверено эмпирически (2026-08-16, подготовка этого workflow) — без
      # --deselect ниже job красный на первом же прогоне не из-за CI, а по
      # этим двум причинам.
      - name: pytest (полный suite, без параллельных флагов)
        run: >
          pytest -q --tb=short
          --deselect tests/test_archive_check_pools.py::test_cold_confirm_only_for_listings_missed_this_circle
          --deselect tests/test_deal_score_as_of_filters.py::test_as_of_backtest_does_not_write_to_db
          --deselect tests/test_entity_resolution_phase.py::test_family_nest_base_vs_letter_block_capped_to_review
          --deselect tests/test_entity_resolution_phase.py::test_same_letter_block_matches_auto
          --deselect tests/test_entity_resolution_phase.py::test_tandau_translit_matches_auto
          --deselect tests/test_entity_resolution_record_link.py::test_already_linked_same_complex_no_queue_write
          --deselect tests/test_entity_resolution_record_link.py::test_conflict_on_different_complex_still_routes_to_queue
          --deselect tests/test_housing_class_model_recompute.py::test_unlabeled_with_known_features_gets_prediction
          --deselect tests/test_housing_class_model_recompute.py::test_unmappable_manual_label_treated_as_no_manual_label
          --deselect tests/test_housing_class_model_recompute.py::test_recompute_returns_summary_counts

      - name: Import smoke test
        run: |
          python -c "
          from bot.core import location_score
          # reviews_pipeline.py/sentiment_analyzer.py — корневые скрипты
          # (тот же паттерн, что 2gis_reviews_collect.py/outcome_labels_
          # recompute.py и т.д.), НЕ пакет bot.reviews — такого пакета в
          # проекте нет, 'from bot.reviews import ...' привёл бы к
          # ModuleNotFoundError на КАЖДОМ прогоне.
          import reviews_pipeline
          import sentiment_analyzer
          print('imports OK')
          "
