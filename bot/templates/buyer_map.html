<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Где хочется жить · Hatuli</title>
  <link rel="icon" type="image/svg+xml" href="/static/branding/hatuli.svg">
  {% include "_hatuli_theme.html" %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/buyer-map.css?v=20261016-zillow">
  <link rel="stylesheet" href="/static/hatuli-design.css?v=20261016-zillow-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="hatuli-miniapp buyer-map">
  <div id="map" aria-label="Карта выбора участков"></div>
  <header>
    <div class="brand"><a href="/" aria-label="Hatuli — главная"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 15 16 5l12 10v12H7V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m12 19 3 3 7-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Hatuli</a><span>Мои места</span></div>
    <h1>Где хочется жить?</h1>
    <p>Нажимайте на участки. Можно выбрать несколько мест.</p>
    <form id="search">
      <select id="kind" aria-label="Тип поиска"><option value="complex">ЖК</option><option value="address">Адрес</option></select>
      <input id="query" placeholder="Название комплекса" maxlength="150" aria-label="Поиск места">
      <button aria-label="Найти">Найти</button>
    </form>
    <div id="results"></div>
  </header>
  <footer>
    <div class="meta"><strong id="count">Выбрано: 0</strong><span>Сторона участка · 100 м</span></div>
    <p id="status" role="status">Загружаем карту…</p>
    <div class="tools"><button id="undo" disabled>↶ Отменить</button><button id="clear" disabled>Очистить</button><button id="fit" disabled>Мои места</button></div>
    <button id="save" disabled>Сохранить места</button>
  </footer>
  <script src="/static/buyer-map.js?v=20261007b"></script>
</body>
</html>
