<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Hatuli — вход через Telegram</title>
  <link rel="icon" type="image/svg+xml" href="/static/branding/hatuli.svg">
  {% include "_hatuli_theme.html" %}
  <link rel="stylesheet" href="/static/hatuli-design.css?v=20261013-5">
  <style>
    * { box-sizing: border-box; }
    body { margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:var(--bg,#f8f8f3);color:var(--text,#293e38);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    .telegram-login { width:100%;max-width:420px;padding:32px;border:1px solid var(--border,#dce5dd);border-radius:18px;background:var(--surface,#fff);box-shadow:0 12px 36px #183c3509; }
    .telegram-login-brand { display:inline-flex;gap:9px;align-items:center;min-height:44px;color:var(--accent,#1e6353);font-size:23px;font-weight:800;text-decoration:none; }
    .telegram-login-brand svg { width:30px;height:30px; }
    h1 { margin:22px 0 12px;font-size:25px;line-height:1.25;color:var(--heading,#183c35); }
    p { margin:0 0 20px;line-height:1.6;font-size:15px; }
    .telegram-login-action { display:inline-flex;justify-content:center;align-items:center;width:100%;min-height:48px;padding:12px 16px;border-radius:12px;background:var(--accent-fill,#1e6353);color:white;font-weight:650;text-decoration:none; }
    .telegram-login-action[hidden] { display:none; }
    a:focus-visible { outline:3px solid var(--focus,#1e6353);outline-offset:3px; }
    @media(max-width:380px) { .telegram-login { padding:24px; } }
  </style>
  <script src="/static/hatuli-telegram-login.js?v=20261013-1" defer></script>
</head>
<body>
  <main class="telegram-login" aria-labelledby="telegram-login-title">
    <a href="/" class="telegram-login-brand" aria-label="Hatuli — главная"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 15 16 5l12 10v12H7V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m12 19 3 3 7-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Hatuli</a>
    <h1 id="telegram-login-title">Входим в Hatuli</h1>
    <p id="telegram-login-status" role="status" aria-live="polite">Подтверждаем вход через Telegram…</p>
    <a id="telegram-login-retry" class="telegram-login-action" href="/cabinet" hidden>Войти ещё раз</a>
    <noscript><p>Для автоматического входа включи JavaScript и снова открой ссылку из бота.</p><a href="/cabinet">Вернуться к входу</a></noscript>
  </main>
</body>
</html>
