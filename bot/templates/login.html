<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hatuli — Вход</title>
  <link rel="icon" type="image/svg+xml" href="/static/branding/hatuli.svg">
  <style>
    * { box-sizing: border-box; }
    body.hatuli-auth {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg, #f8f8f3);
      color: var(--text, #293e38);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: var(--surface, #fff);
      border: 1px solid var(--border, #dce5dd);
      border-radius: 18px;
      box-shadow: 0 12px 36px #183c3509;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      color: var(--accent, #1e6353);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.6px;
      text-decoration: none;
    }
    .auth-brand svg { width: 30px; height: 30px; }
    .auth-card h1 {
      margin: 22px 0 8px;
      color: #183c35;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -.6px;
    }
    .auth-sub {
      margin: 0 0 26px;
      color: var(--muted, #65766f);
      font-size: 14px;
      line-height: 1.5;
    }
    .auth-card label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .auth-card input {
      width: 100%;
      min-height: 48px;
      margin-bottom: 20px;
      padding: 12px 14px;
      border: 1px solid var(--border, #dce5dd);
      border-radius: 12px;
      background: var(--surface, #fff);
      color: var(--text, #293e38);
      font: inherit;
      font-size: 16px;
    }
    .auth-card input::placeholder { color: var(--muted, #65766f); opacity: 1; }
    .auth-card button {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid var(--accent, #1e6353);
      border-radius: 12px;
      background: var(--accent, #1e6353);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease;
    }
    .auth-card button:hover { background: #184f43; }
    .auth-card :is(a, input, button):focus-visible {
      outline: 3px solid #1e6353;
      outline-offset: 3px;
    }
    .auth-error {
      margin-bottom: 20px;
      padding: 12px 14px;
      border: 1px solid #e8c8c1;
      border-radius: 12px;
      background: #fff3ef;
      color: #8a3429;
      font-size: 14px;
      line-height: 1.5;
    }
    .auth-back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 16px;
      color: var(--accent, #1e6353);
      font-size: 14px;
      text-underline-offset: 3px;
    }
    @media (max-width: 380px) {
      .auth-card { padding: 24px; }
      .auth-card h1 { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .auth-card button { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="/static/hatuli-design.css?v=20261012-2">
</head>
<body class="hatuli-auth">
  <main class="auth-card" aria-labelledby="login-title">
    <a class="auth-brand" href="/" aria-label="Hatuli — главная"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 15 16 5l12 10v12H7V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m12 19 3 3 7-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Hatuli</a>
    <h1 id="login-title">Вход в панель</h1>
    <p class="auth-sub">Управление Hatuli</p>
    {% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <label for="username">Логин</label>
      <input id="username" type="text" name="username" placeholder="admin" value="admin" autocomplete="username" autofocus>
      <label for="password">Пароль</label>
      <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit">Войти →</button>
    </form>
    <a class="auth-back" href="/">← Вернуться на сайт</a>
  </main>
</body>
</html>
