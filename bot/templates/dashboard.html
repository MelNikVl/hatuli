{% extends "base.html" %}
{% block content %}
{% set admin = is_admin(request) %}
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
  <div class="page-title" style="margin-bottom:0;">Карта предложений Астаны</div>
  {% if admin %}<div id="admin-stats" style="display:flex;gap:10px;flex-wrap:wrap;"></div>{% endif %}
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Статистика (админ) -->
<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;">
<!-- Фильтры справа: порядок в flex через order -->
<div style="order:2;flex:0 0 340px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;">
  <div><label style="font-size:11px;color:#888;display:block;">Тип</label>
    <select id="f-type" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="sale">Продажа</option><option value="rental">Аренда</option>
    </select></div>
  <div><label style="font-size:11px;color:#888;display:block;">Комнат</label>
    <select id="f-rooms" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">любые</option><option>1</option><option>2</option><option>3</option><option>4</option>
    </select></div>
  <div id="f-market-wrap"><label style="font-size:11px;color:#888;display:block;">Рынок</label>
    <select id="f-market" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">весь</option><option value="secondary">вторичка</option><option value="primary">первичка (в стройке)</option>
    </select></div>
  <div><label style="font-size:11px;color:#888;display:block;">Продавец</label>
    <select id="f-seller" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">все</option><option value="owner">от собственника</option><option value="agent">от агента</option>
    </select></div>
  <div><label style="font-size:11px;color:#888;display:block;" id="f-price-label">Цена (млн ₸ или ₸)</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input id="f-pmin" type="number" min="0" step="1" placeholder="от" style="width:50%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <span style="color:#888;">—</span>
      <input id="f-pmax" type="number" min="0" step="1" placeholder="до" style="width:50%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
      <span style="font-size:10.5px;color:#aaa;">можно 25 или 25000000</span>
      <button type="button" onclick="document.getElementById('f-pmin').value='';document.getElementById('f-pmax').value='';applyFilters();" style="padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:#888;font-size:11px;cursor:pointer;">✕ сбросить цену</button>
    </div></div>
  <div id="f-score-wrap"><label style="font-size:11px;color:#888;display:block;">Мин. скор</label>
    <input id="f-score" type="number" min="0" max="100" step="5" style="width:80px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);"></div>
  {% if admin %}
  <label style="font-size:13px;cursor:pointer;padding-bottom:8px;"><input type="checkbox" id="poi-toggle"> 🏫 школы/садики</label>
  {% endif %}
  <button onclick="applyFilters()" style="padding:11px 26px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer;">Показать</button>
  <a href="https://docs.google.com/spreadsheets/d/1KaHKjg70JEfX3kLc7A8ZtNPJwsp108iSA8kIqVfrtdI/edit" target="_blank" style="text-align:center;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;text-decoration:none;">📗 Google Sheets</a>
  <span id="result-count" style="font-size:13px;color:#888;"></span>
  {% if admin %}
  <button id="hex-toggle" onclick="toggleHexGrid()" style="padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;">⬡ Гекс-сетка: выкл</button>
  {% endif %}
</div>

<!-- Карта: слева, занимает всё свободное место.
     РАЗМЕР КАРТЫ меняется здесь:
       - ширина: flex-basis/max-width у контейнера ниже (сейчас flex:1 1 720px, без max-width = растягивается)
       - высота: aspect-ratio у #objects-map (16/10, 1/1, 4/3...) или задай фикс. height, напр. height:75vh -->
<div style="order:1;flex:1 1 600px;min-width:320px;">

<div id="map-wrap" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;">
  <div id="objects-map" style="aspect-ratio:3/2;width:100%;min-height:380px;border-radius:8px;"></div>
</div>

</div><!-- /левая колонка -->
</div><!-- /flex -->

<script>
const map = L.map('objects-map').setView([51.128, 71.43], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OSM'}).addTo(map);
const pointsLayer = L.layerGroup().addTo(map);

// Фотокарусель в попапах
const ptPhotos = {}, carIdx = {};
function carNav(id, dir, ev) {
  ev.stopPropagation();
  const ph = ptPhotos[id]; if (!ph || !ph.length) return;
  carIdx[id] = (carIdx[id] + dir + ph.length) % ph.length;
  const img = document.getElementById('car-' + id);
  if (img) img.src = ph[carIdx[id]];
  const n = document.getElementById('car-n-' + id);
  if (n) n.textContent = (carIdx[id] + 1) + '/' + ph.length;
}

function scoreColor(s, p10, p90) {
  const t = p90 > p10 ? Math.max(0, Math.min(1, (s - p10) / (p90 - p10))) : 0.5;
  const from = [156,163,175], to = [22,163,74];
  const c = from.map((f,i) => Math.round(f + (to[i]-f)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function percentile(arr, p) {
  const s = [...arr].sort((a,b) => a-b);
  return s[Math.min(Math.floor(s.length * p), s.length - 1)];
}

function applyFilters() {
  const type = document.getElementById('f-type').value;
  const p = new URLSearchParams({type});
  const rooms = document.getElementById('f-rooms').value;
  // цена: принимаем и "25" (млн), и "25000000" (тенге); аренда — "300" (тыс) или "300000"
  const toTenge = v => {
    if (!(v > 0)) return 0;
    if (type === 'rental') return v >= 10000 ? Math.round(v) : Math.round(v * 1e3);
    return v >= 10000 ? Math.round(v) : Math.round(v * 1e6);
  };
  const pmin = toTenge(parseFloat(document.getElementById('f-pmin').value || 0));
  const pmax = toTenge(parseFloat(document.getElementById('f-pmax').value || 0));
  const ms = document.getElementById('f-score').value;
  if (rooms) p.set('rooms', rooms);
  if (pmin > 0) p.set('price_min', pmin);
  if (pmax > 0) p.set('price_max', pmax);
  if (ms && type === 'sale') p.set('min_score', ms);
  const seller = document.getElementById('f-seller').value;
  if (seller && type === 'sale') p.set('seller', seller);
  const market = document.getElementById('f-market').value;
  if (market && type === 'sale') p.set('market', market);

  document.getElementById('f-market-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('f-score-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('f-price-label').textContent = type === 'rental' ? 'Цена (тыс ₸/мес или ₸)' : 'Цена (млн ₸ или ₸)';

  fetch('/admin/api/map-points?' + p.toString()).then(r => r.json()).then(d => {
    if (type === 'rental') {
      pointsLayer.clearLayers();
      lastPoints = d.points || [];
      lastPoints.forEach(pt => {
        const m = L.circleMarker([pt.lat, pt.lon], {radius:6, fillColor:'#3b82f6', color:'#fff', weight:1, fillOpacity:.85}).addTo(pointsLayer);
        const cx = pt.complex ? `<a href="/admin/complex/find?name=${encodeURIComponent(pt.complex)}">${pt.complex}</a>` : 'ЖК не определён';
        m.bindPopup(`<b>Аренда: ${pt.price ? (pt.price/1000).toFixed(0) + ' тыс ₸/мес' : '—'}</b> · ${pt.rooms || '?'}-комн<br>🏢 ${cx}<br><span style="color:#888;">привязка к карте: по ${pt.binding} (приблизительно)</span><br>найдено ${pt.found}${pt.url ? ' · <a href="' + pt.url + '" target="_blank">Крыша</a>' : ''}`);
      });
      document.getElementById('result-count').textContent = d.count + ' на карте' + (d.no_geo ? ` (ещё ${d.no_geo} совсем без привязки)` : '');
      if (hexOn) drawHexGrid();
      return;
    }
    pointsLayer.clearLayers();
    const scores = d.points.map(pt => pt.score);
    const p10 = percentile(scores, 0.10), p90 = percentile(scores, 0.90);
    d.points.forEach(pt => {
      let m;
      if (pt.top) {
        m = L.marker([pt.lat, pt.lon], {icon: L.divIcon({className:'', html:'<div style="font-size:22px;line-height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));">❤️</div>', iconSize:[22,22], iconAnchor:[11,11]}), zIndexOffset:1000}).addTo(pointsLayer);
      } else {
        m = L.circleMarker([pt.lat, pt.lon], {radius:6, fillColor:scoreColor(pt.score,p10,p90), color:'#fff', weight:1, fillOpacity:.85}).addTo(pointsLayer);
      }
      const priceM = pt.price ? (pt.price/1e6).toFixed(1) : '—';
      const areaTxt = pt.area ? Math.round(pt.area) : '?';
      const ppm = (pt.price && pt.area) ? ' · ' + Math.round(pt.price/pt.area/1000) + ' тыс ₸/м²' : '';
      const ageText = pt.age === 0 ? 'сегодня' : pt.age + ' дн.';
      let priceTrend = '';
      if (pt.prev_price && pt.prev_price !== pt.price) {
        const dp = (pt.price - pt.prev_price) / 1e6;
        const dir = dp > 0;
        priceTrend = ` · <span style="color:${dir ? '#ef4444' : '#16a34a'};font-weight:700;">${dir ? '▲' : '▼'} ${Math.abs(dp).toFixed(1)} млн${pt.price_changed ? ' ' + pt.price_changed : ''}</span>`;
      }
      const sc = scoreColor(pt.score, p10, p90);
      if (pt.photos && pt.photos.length) { ptPhotos[pt.id] = pt.photos; carIdx[pt.id] = 0; }
      const carHtml = pt.photos && pt.photos.length ? `
<div style="position:relative;margin-bottom:7px;border-radius:8px;overflow:hidden;">
  <img id="car-${pt.id}" src="${pt.photos[0]}" style="width:100%;height:135px;object-fit:cover;display:block;" onerror="this.parentNode.style.display='none'">
  ${pt.photos.length > 1 ? `
  <button onclick="carNav('${pt.id}',-1,event)" style="position:absolute;left:4px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:15px;line-height:1;">‹</button>
  <button onclick="carNav('${pt.id}',1,event)" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:15px;line-height:1;">›</button>
  <span id="car-n-${pt.id}" style="position:absolute;right:6px;bottom:4px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;border-radius:6px;padding:1px 7px;">1/${pt.photos.length}</span>` : ''}
</div>` : '';
      const cxLine = pt.complex
        ? `<div style="font-size:12.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🏢 <a href="/admin/complex/find?name=${encodeURIComponent(pt.complex)}" style="font-weight:600;">${pt.complex}</a></div>`
        : '<div style="font-size:12px;color:#b45309;margin-top:7px;">🏢 ЖК не определён</div>';
      m.bindPopup(`
<div style="min-width:255px;max-width:290px;font-family:inherit;">
  ${carHtml}
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
    <div>
      <div style="font-size:21px;font-weight:800;line-height:1.05;">${priceM} <span style="font-size:14px;font-weight:700;">млн ₸</span></div>
      <div style="font-size:14px;color:#374151;margin-top:3px;">${pt.rooms || '?'}-комн · <b style="font-size:15px;">${areaTxt}</b> м²<span style="font-size:11.5px;color:#888;">${ppm}</span></div>
    </div>
    <a href="/admin/analytics/${pt.id}" title="Скор — нажми, чтобы увидеть из чего он складывается" style="background:${sc};color:#fff;border-radius:9px;padding:5px 10px;font-weight:800;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.25);text-decoration:none;display:block;">${pt.score}</a>
  </div>
  ${pt.market === 'primary' ? '<div style="display:inline-block;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:5px;">🏗 первичка</div>' : ''}
  <div style="font-size:11.5px;color:#888;margin-top:5px;">на рынке: ${ageText}${priceTrend}${pt.geo === 'address' ? ' · <span style="color:#b45309;">📍 привязка по адресу (≈)</span>' : ''}</div>
  <div id="ph-${pt.id}" style="margin:7px 0 1px;"></div>
  ${cxLine}
  ${pt.address ? `<div style="font-size:11.5px;color:#666;margin-top:2px;">📍 ${pt.address}</div>` : ''}
  <div style="margin-top:9px;padding-top:7px;border-top:1px solid #eee;display:flex;gap:14px;font-size:13px;">
    <a href="/admin/analytics/${pt.id}" style="font-weight:700;">Карточка →</a>
    <a href="${pt.url}" target="_blank" style="color:#2563eb;">Крыша ↗</a>
  </div>
</div>`);
      m.on('popupopen', () => loadPriceHistory(pt.id));
    });
    document.getElementById('result-count').textContent = d.count + ' объектов';
    lastPoints = d.points;
    if (d.coverage) {
      hexEdge = d.coverage.hex_edge || 50;
      const pct = d.coverage.total ? Math.round(100*d.coverage.with_coords/d.coverage.total) : 0;
      const kr = d.coverage.krisha_total;
      const el = document.getElementById('admin-stats');
      if (el) el.innerHTML = mkStats([
        [d.coverage.total.toLocaleString('ru'), 'активных объявлений'],
        [(d.coverage.complexes || 0).toLocaleString('ru'), 'ЖК в базе'],
        [`${d.coverage.with_coords.toLocaleString('ru')} · ${pct}%`, 'с координатами'],
        [d.coverage.dups.toLocaleString('ru'), 'дублей среди активных'],
        [`<a href="/admin/unbound" style="color:inherit;">${(d.coverage.unbound || 0).toLocaleString('ru')}</a>`, 'без привязки к ЖК'],
        [kr ? kr.toLocaleString('ru') : '—', 'всего на Крыше (≤ потолка цены)'],
      ]);
      if (hexOn) drawHexGrid();
    }
  });
}
function mkStats(items) {
  return items.map(([v,l]) => `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;"><div style="font-size:17px;font-weight:800;line-height:1.1;">${v}</div><div style="font-size:11px;color:#888;">${l}</div></div>`).join('');
}

// Мини-график истории цены (SVG) — подгружается при открытии попапа
function sparklineSVG(points, w, h) {
  if (points.length === 0) return '';
  const prices = points.map(p => p.price);
  const mn = Math.min(...prices), mx = Math.max(...prices);
  const span = mx - mn || 1;
  const stepX = points.length > 1 ? w / (points.length - 1) : 0;
  const coords = points.map((p, i) => [i * stepX, h - ((p.price - mn) / span) * (h - 6) - 3]);
  const path = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.4" fill="#2563eb"/>`).join('');
  return `<svg width="${w}" height="${h}" style="display:block;">` +
         `<path d="${path}" fill="none" stroke="#2563eb" stroke-width="1.6"/>${dots}</svg>`;
}
function loadPriceHistory(id) {
  const el = document.getElementById('ph-' + id);
  if (!el || el.dataset.loaded) return;
  el.dataset.loaded = '1';
  fetch('/admin/api/price-history/' + encodeURIComponent(id)).then(r => r.json()).then(d => {
    if (!d.points || d.points.length === 0) { el.innerHTML = '<span style="color:#888;font-size:12px;">изменений цены не было</span>'; return; }
    const rows = d.points.map(p => `<span style="white-space:nowrap;">${p.at}: <b>${(p.price/1e6).toFixed(1)}</b></span>`).join(' → ');
    el.innerHTML = `<div style="font-size:11px;color:#888;">история цены, млн ₸</div>` +
      sparklineSVG(d.points, 220, 44) +
      `<div style="font-size:11px;color:#555;margin-top:2px;">${rows} млн</div>`;
  }).catch(() => { el.innerHTML = ''; });
}

let lastPoints = [], hexOn = false, hexEdge = 50;
const hexLayer = L.layerGroup();
const LAT0 = 51.128, LON0 = 71.430,
      MLAT = 110574.0, MLON = 111320.0 * Math.cos(LAT0 * Math.PI/180);
function hexAxial(lat, lon, edge) {
  const x = (lon - LON0) * MLON, y = (lat - LAT0) * MLAT;
  let q = (Math.sqrt(3)/3 * x - y/3) / edge, r = (2/3 * y) / edge;
  const s = -q - r;
  let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const dq = Math.abs(rq-q), dr = Math.abs(rr-r), ds = Math.abs(rs-s);
  if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
  return [rq, rr];
}
function hexCenter(q, r, edge) {
  const x = edge * Math.sqrt(3) * (q + r/2), y = edge * 1.5 * r;
  return [LAT0 + y/MLAT, LON0 + x/MLON];
}
function hexCorners(q, r, edge) {
  const [clat, clon] = hexCenter(q, r, edge);
  const out = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI/180 * (60*i - 30);
    out.push([clat + (edge*Math.sin(a))/MLAT, clon + (edge*Math.cos(a))/MLON]);
  }
  return out;
}
function drawHexGrid() {
  hexLayer.clearLayers();
  const seen = new Set();
  lastPoints.forEach(p => {
    const [q, r] = hexAxial(p.lat, p.lon, hexEdge);
    const key = q + ':' + r;
    if (seen.has(key)) return;
    seen.add(key);
    // interactive:false — сетка чисто визуальная, клики проходят сквозь неё к маркерам
    L.polygon(hexCorners(q, r, hexEdge), {color:'#8b5cf6', weight:1, fillOpacity:0.06, interactive:false}).addTo(hexLayer);
  });
  hexLayer.addTo(map);
}
function toggleHexGrid() {
  hexOn = !hexOn;
  const b = document.getElementById('hex-toggle');
  if (hexOn) { drawHexGrid(); b.textContent = '⬡ Гекс-сетка: вкл (' + hexEdge + 'м)'; }
  else { map.removeLayer(hexLayer); b.textContent = '⬡ Гекс-сетка: выкл'; }
}

applyFilters();

{% if admin %}
const poiLayer = L.layerGroup();
let poiLoaded = false;
document.getElementById('poi-toggle').addEventListener('change', function() {
  if (this.checked) {
    if (!poiLoaded) {
      fetch('/admin/api/city-poi').then(r => r.json()).then(d => {
        d.poi.forEach(p => {
          const icon = p.kind === 'school' ? '🏫' : p.kind === 'kindergarten' ? '🧸' : '🎓';
          L.marker([p.lat, p.lon], {icon: L.divIcon({className:'', html:`<div style="font-size:14px;opacity:.85;">${icon}</div>`, iconSize:[14,14], iconAnchor:[7,7]})})
            .bindTooltip(`${icon} ${p.name || p.kind}${p.address ? '<br>' + p.address : ''}`).addTo(poiLayer);
        });
        poiLoaded = true;
      });
    }
    poiLayer.addTo(map);
  } else { map.removeLayer(poiLayer); }
});
{% endif %}
</script>
{% endblock %}
