{% extends "base.html" %}
{% block content %}
{% set admin = is_admin(request) %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<style>
/* Цифра числа объявлений в кластере — чёрная и чуть жирнее дефолта */
.marker-cluster span { color:#000; font-weight:600; }
/* Кружки кластеров — голубые, в тон синим плашкам цены (вместо дефолтных зелёных/жёлтых) */
.marker-cluster-small { background-color: rgba(37,99,235,.25); }
.marker-cluster-small div { background-color: rgba(37,99,235,.55); }
.marker-cluster-medium { background-color: rgba(29,78,216,.3); }
.marker-cluster-medium div { background-color: rgba(29,78,216,.6); }
.marker-cluster-large { background-color: rgba(30,58,138,.35); }
.marker-cluster-large div { background-color: rgba(30,58,138,.65); }
/* Треугольник тренда цены на плашке — лёгкая пульсация, чтобы был заметнее */
.price-trend-arrow { animation: trendPulse 1.4s ease-in-out infinite; }
@keyframes trendPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
/* Цена прямо на гексагоне мини-карты — жирный, хорошо читаемый шрифт с обводкой */
.hex-price-label { background:transparent; border:none; box-shadow:none; padding:0; font-weight:800; font-size:12px; color:#fff; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
.hex-price-label::before { display:none; }
/* Двойной ползунок диапазона (цена/метраж) — два <input type=range> наложены
   друг на друга, трек прозрачный у обоих, видна только область/бегунки. */
.range-slider { position: relative; height: 22px; margin-top: 8px; }
.range-slider input[type=range] {
  position: absolute; left: 0; top: 8px; width: 100%; margin: 0;
  -webkit-appearance: none; appearance: none; background: transparent; pointer-events: none;
}
.range-slider input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--border); border-radius: 2px; }
.range-slider input[type=range]::-moz-range-track { height: 4px; background: var(--border); border-radius: 2px; }
.range-slider input[type=range]::-webkit-slider-thumb {
  pointer-events: all; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #2563eb; border: 2px solid #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.range-slider input[type=range]::-moz-range-thumb {
  pointer-events: all; width: 16px; height: 16px; border-radius: 50%; background: #2563eb;
  border: 2px solid #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
</style>

<!-- Статистика (админ) -->
<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;">
<!-- Фильтры справа: порядок в flex через order -->
<div style="order:2;flex:0 0 340px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;">
  <div id="load-progress-wrap" style="display:none;">
    <div style="height:8px;border-radius:4px;background:var(--bg);overflow:hidden;position:relative;">
      <div id="load-progress-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:4px;transition:width .2s ease;"></div>
    </div>
    <div id="load-progress-label" style="font-size:11px;color:#888;margin-top:3px;text-align:right;">0%</div>
  </div>
  <div><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Тип</label>
    <select id="f-type" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="sale">Продажа</option><option value="rental">Аренда</option><option value="complex">ЖК</option>
    </select></div>
  <div id="f-listing-filters">
  <div><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Комнат</label>
    <select id="f-rooms" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">любые</option><option>1</option><option>2</option><option>3</option><option>4</option>
    </select></div>
  <div id="f-market-wrap"><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Рынок</label>
    <select id="f-market" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">весь</option><option value="secondary">вторичка</option><option value="primary">первичка (в стройке)</option>
    </select></div>
  <div><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Продавец</label>
    <select id="f-seller" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">все</option><option value="owner">от собственника</option><option value="agent">от агента</option>
    </select></div>
  <div id="f-pricechange-wrap"><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Изменение цены</label>
    <select id="f-pricechange" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">любое</option><option value="dropped_today">▼ снизили цену сегодня</option><option value="raised_today">▲ подняли цену сегодня</option>
    </select></div>
  <div id="f-finish-wrap"><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Отделка</label>
    <select id="f-finish" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">любая</option><option value="черновая">бетон (черновая)</option><option value="с отделкой">с отделкой</option><option value="с мебелью">с мебелью</option>
    </select>
    <span style="font-size:10.5px;color:#aaa;">по тексту объявления — не у всех определена</span></div>
  <div><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;" id="f-price-label">Цена (млн ₸ или ₸)</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input id="f-pmin" type="number" min="0" step="1" placeholder="от" style="width:50%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <span style="color:#888;">—</span>
      <input id="f-pmax" type="number" min="0" step="1" placeholder="до" style="width:50%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
    </div>
    <div class="range-slider">
      <input id="f-pmin-rng" type="range" min="0" max="200" step="1" value="0">
      <input id="f-pmax-rng" type="range" min="0" max="200" step="1" value="200">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
      <span style="font-size:10.5px;color:#aaa;">можно 25 или 25000000</span>
      <button type="button" onclick="document.getElementById('f-pmin').value='';document.getElementById('f-pmax').value='';document.getElementById('f-pmin-rng').value=0;document.getElementById('f-pmax-rng').value=document.getElementById('f-pmax-rng').max;applyFilters();" style="padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:#888;font-size:11px;cursor:pointer;">✕ сбросить цену</button>
    </div></div>
  <div><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Метраж (м²)</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input id="f-amin" type="number" min="0" step="1" placeholder="от" style="width:50%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <span style="color:#888;">—</span>
      <input id="f-amax" type="number" min="0" step="1" placeholder="до" style="width:50%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
    </div>
    <div class="range-slider">
      <input id="f-amin-rng" type="range" min="0" max="300" step="1" value="0">
      <input id="f-amax-rng" type="range" min="0" max="300" step="1" value="300">
    </div></div>
  <div id="f-score-wrap"><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;">Минимальный смарт рейтинг</label>
    <input id="f-score" type="number" min="0" max="100" step="5" style="width:80px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);"></div>
  <div id="f-top-wrap"><label style="font-size:13.5px;color:var(--text);font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input id="f-top-only" type="checkbox" onchange="applyFilters()"> ⭐ Только топ-10 по скору</label></div>
  </div>
  <div><label style="font-size:13.5px;color:var(--text);font-weight:700;display:block;margin-bottom:4px;">Тепловые карты</label>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <button type="button" class="heat-btn" data-mode="sale" onclick="toggleHeat('sale')" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;">💰 Цены продажи</button>
      <button type="button" class="heat-btn" data-mode="rental" onclick="toggleHeat('rental')" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;">🏠 Цены аренды</button>
      <button type="button" class="heat-btn" data-mode="schools" onclick="toggleHeat('schools')" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;">🏫 Школы</button>
      <button type="button" class="heat-btn" data-mode="noise" onclick="toggleHeat('noise')" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;">🚗 Шум (предв.)</button>
    </div>
  </div>
  <button onclick="applyFilters()" style="padding:11px 26px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer;">Показать</button>
  <a href="https://docs.google.com/spreadsheets/d/1KaHKjg70JEfX3kLc7A8ZtNPJwsp108iSA8kIqVfrtdI/edit" target="_blank" style="text-align:center;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;text-decoration:none;">📗 Google Sheets</a>
  <span id="result-count" style="font-size:13px;color:#888;"></span>
  {% if admin %}
  <button id="hex-toggle" onclick="toggleHexGrid()" style="padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;">⬡ Гекс-сетка: выкл</button>
  <hr style="width:100%;border:none;border-top:1px solid var(--border);margin:2px 0;">
  <div id="admin-stats" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
  {% endif %}
</div>

<!-- Карта: слева, занимает всё свободное место, но не более 85% ширины блока
     (уменьшена на 15% — без max-width flex:1 всё равно растягивался бы на 100%).
     РАЗМЕР КАРТЫ меняется здесь:
       - ширина: flex-basis/max-width у контейнера ниже
       - высота: aspect-ratio у #objects-map (16/10, 1/1, 4/3...) или задай фикс. height, напр. height:75vh -->
<div style="order:1;flex:1 1 600px;min-width:320px;max-width:85%;">

<div id="map-wrap" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;">
  <div id="objects-map" style="aspect-ratio:3/2;width:100%;min-height:380px;border-radius:8px;"></div>
</div>

</div><!-- /левая колонка -->
</div><!-- /flex -->

<script>
const IS_ADMIN = {{ 'true' if admin else 'false' }};
const POPUP_WIDTH = {{ popup_width | default(380) }};
// Реестр маркеров по id объявления — чтобы клик по мини-плашке внутри
// маленького (<=3) кластера открывал попап именно этого объявления
// напрямую, без spiderfy (см. openMiniClusterPin).
const MINI_PIN_MARKERS = {};
function openMiniClusterPin(id) {
  const m = MINI_PIN_MARKERS[id];
  if (!m) return;
  const latlng = m.getLatLng();
  L.popup({maxWidth: POPUP_WIDTH, minWidth: Math.min(POPUP_WIDTH, 260), autoPan: false})
    .setLatLng(latlng)
    .setContent(m.getPopup().getContent())
    .openOn(map);
  map.panTo(latlng, {animate: true});
  loadPriceHistory(id);
  loadListingExtras(id);
}
// Кеширующий прокси фото (см. /img-proxy на бэкенде) — первый показ идёт на
// источник и кэшируется на диске сервера, дальше отдаётся с диска.
function proxyImg(url) { return url ? '/img-proxy?u=' + encodeURIComponent(url) : url; }
const map = L.map('objects-map').setView([51.128, 71.43], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OSM'}).addTo(map);
const pointsLayer = L.layerGroup().addTo(map);  // аренда: обычные circleMarker (маркер-кластер их не поддерживает)

// ── Кнопки прямо на карте (как на Zillow): нарисовать область, школы ──────
const MapButtons = L.Control.extend({
  options: {position: 'topright'},
  onAdd: function() {
    const box = L.DomUtil.create('div', '');
    box.style.cssText = 'display:flex;gap:8px;';
    box.innerHTML = `
      <button id="btn-schools" type="button" style="padding:8px 14px;border:2px solid #2563eb;border-radius:20px;background:#fff;color:#2563eb;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);">🏫 Школы</button>
      <button id="btn-draw" type="button" style="padding:8px 14px;border:2px solid #2563eb;border-radius:20px;background:#fff;color:#2563eb;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);">✏️ Нарисовать область</button>
      <button id="btn-draw-clear" type="button" style="display:none;padding:8px 14px;border:none;border-radius:20px;background:#ef4444;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);">✕ Убрать область</button>
    `;
    L.DomEvent.disableClickPropagation(box);
    return box;
  },
});
map.addControl(new MapButtons());

// Точка внутри полигона (ray casting)
function pointInPolygon(lat, lon, latlngs) {
  let inside = false;
  for (let i = 0, j = latlngs.length - 1; i < latlngs.length; j = i++) {
    const yi = latlngs[i].lat, xi = latlngs[i].lng;
    const yj = latlngs[j].lat, xj = latlngs[j].lng;
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

let drawnPolygon = null;  // массив L.LatLng или null
const drawnAreaLayer = L.layerGroup().addTo(map);
let drawHandler = null;

document.getElementById('btn-draw').addEventListener('click', function() {
  if (drawHandler) { drawHandler.disable(); drawHandler = null; }
  drawHandler = new L.Draw.Polygon(map, {
    shapeOptions: {color:'#2563eb', weight:2, fillOpacity:0.12},
    showArea: false,
  });
  drawHandler.enable();
});
map.on(L.Draw.Event.CREATED, function(e) {
  drawnAreaLayer.clearLayers();
  drawnAreaLayer.addLayer(e.layer);
  drawnPolygon = e.layer.getLatLngs()[0];
  document.getElementById('btn-draw-clear').style.display = '';
  document.getElementById('btn-draw').textContent = '✏️ Перерисовать область';
  applyFilters();
});
document.getElementById('btn-draw-clear').addEventListener('click', function() {
  drawnPolygon = null;
  drawnAreaLayer.clearLayers();
  this.style.display = 'none';
  document.getElementById('btn-draw').textContent = '✏️ Нарисовать область';
  applyFilters();
});
// Продажа: кастомные HTML-плашки с ценой — без кластеризации сотни таких
// пинов тормозят рендер/пан карты. Отдельный слой, т.к. L.markerClusterGroup
// умеет клизировать только L.Marker, а не L.circleMarker (аренда выше).
const saleCluster = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnEveryZoom: true,  // без этого на макс. зуме близкие пины оставались нераздельными и накладывались друг на друга — по такому нельзя было кликнуть
  zoomToBoundsOnClick: true,
  // Плашки с ценой широкие (текст "1к | 16.0 M"), а дефолтный радиус
  // "раскрытия" рассчитан на маленькие круглые иконки — несколько квартир
  // в одном ЖК (почти одинаковые координаты) после spiderfy всё равно
  // накладывались друг на друга. x2.2 — достаточно, чтобы плашки не пересекались.
  iconCreateFunction: function(cluster) {
    const markers = cluster.getAllChildMarkers();
    const n = markers.length;
    // Дом с 2-3 объявлениями — не прячем их за кружком-счётчиком, а
    // показываем прямо стопкой мини-плашек с ценой на месте дома.
    if (n <= 3) {
      const mini = markers.map(m => {
        const meta = m.options.pinMeta;
        if (!meta) return '';
        const priceTxt = fmtPriceShort(meta.pt.price);
        const roomsTxt = meta.pt.rooms ? meta.pt.rooms + 'к' : '?';
        // Клик по конкретной мини-плашке открывает превью ЭТОГО объявления
        // напрямую (без zoomToBoundsOnClick/spiderfy кластера) — раз мы уже
        // показали 2-3 варианта отдельно, лишний "разлёт" по треугольнику не нужен.
        return `<div onclick="event.stopPropagation();openMiniClusterPin('${meta.pt.id}')" style="cursor:pointer;background:${meta.pinBg};color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4);margin-bottom:2px;">${meta.isTop ? '⭐' : ''}${roomsTxt} · ${priceTxt}</div>`;
      }).join('');
      return L.divIcon({
        html: `<div style="display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);">${mini}</div>`,
        className: '',
        iconSize: [0, 0],
        iconAnchor: [0, 0],
      });
    }
    const count = cluster.getChildCount();
    let sizeClass = 'marker-cluster-small';
    if (count >= 100) sizeClass = 'marker-cluster-large';
    else if (count >= 10) sizeClass = 'marker-cluster-medium';
    return L.divIcon({html: `<div><span>${count}</span></div>`, className: 'marker-cluster ' + sizeClass, iconSize: L.point(40, 40)});
  },
});
// Топ-10 по скору — отдельный НЕкластеризуемый слой, чтобы они не прятались
// внутри кластеров и были видны на любом масштабе карты.
const topLayer = L.layerGroup();

// ── Слой ЖК: контур-кружок вокруг центроида + попап с данными по клику ────
const complexLayer = L.layerGroup();
let complexesCache = null;

async function drawComplexLayer() {
  if (!map.hasLayer(complexLayer)) complexLayer.addTo(map);
  complexLayer.clearLayers();
  if (!complexesCache) {
    complexesCache = await (await fetch('/admin/api/complexes-layer')).json().then(d => d.complexes || []);
  }
  let list = complexesCache;
  if (drawnPolygon) list = list.filter(c => pointInPolygon(c.lat, c.lon, drawnPolygon));
  document.getElementById('result-count').textContent = list.length + ' ЖК' + (drawnPolygon ? ' в области' : '');
  list.forEach(c => {
    // радиус контура растёт с числом активных объявлений — крупные ЖК заметнее
    const radius = 60 + Math.min(140, (c.active || 0) * 6);
    const circle = L.circle([c.lat, c.lon], {
      radius, color:'#7c3aed', weight:2.5, fillColor:'#a78bfa', fillOpacity:0.18,
    }).addTo(complexLayer);
    circle.bindTooltip(c.name, {sticky:true});
    circle.on('click', () => openComplexPopup(c, circle));
  });
}

function openComplexPopup(c, layer) {
  const loadingHtml = `<div style="min-width:240px;padding:10px;text-align:center;color:#888;">Загрузка…</div>`;
  layer.bindPopup(loadingHtml).openPopup();
  fetch('/admin/api/complex-summary/' + c.id).then(r => r.json()).then(d => {
    if (d.error) return;
    const photoHtml = d.photo

}

// Тезисное объяснение скора по составляющим (см. score_yield/20, score_price_market/15,
// score_location/20, score_apt_type/15, score_floor/8, score_complex/15, score_supply/7 —
// те же категории, что в Telegram-алертах service_alerts.py)
const SCORE_CATEGORIES = [
  ['yield', 20, 'доходность аренды'],
  ['price_market', 15, 'цена относительно рынка'],
  ['location', 20, 'локация'],
  ['apt_type', 15, 'тип/планировка'],
  ['floor', 8, 'этаж'],
  ['complex', 15, 'жилой комплекс'],
  ['supply', 7, 'мало похожих предложений рядом'],
];
function scoreExplainText(bd) {
  if (!bd) return 'Скор — нажми, чтобы увидеть из чего он складывается';
  const good = [], bad = [];
  SCORE_CATEGORIES.forEach(([key, max, label]) => {
    const v = bd[key];
    if (v == null) return;
    const ratio = v / max;
    if (ratio >= 0.7) good.push(label);
    else if (ratio <= 0.3) bad.push(label);
  });
  const lines = [];
  if (good.length) lines.push('+ ' + good.join(', '));
  if (bad.length) lines.push('− ' + bad.join(', '));
  if (!lines.length) return 'Смешанные показатели по всем категориям — нажми для деталей';
  return lines.join('\n') + '\n\nНажми для полной раскладки';
}

document.addEventListener('keydown', (e) => {
  if (!lbId) return;
  // Стрелки/Esc — только для лайтбокса. Без preventDefault+stopPropagation
  // тот же keydown ловит Leaflet (карта под лайтбоксом ещё в фокусе) и
  // одновременно двигает карту стрелками — визуально "уезжает" фон.
  if (e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {

function scoreColor(s, p10, p90) {
  const t = p90 > p10 ? Math.max(0, Math.min(1, (s - p10) / (p90 - p10))) : 0.5;
  const from = [156,163,175], to = [22,163,74];
  const c = from.map((f,i) => Math.round(f + (to[i]-f)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function percentile(arr, p) {
  const s = [...arr].sort((a,b) => a-b);
  return s[Math.min(Math.floor(s.length * p), s.length - 1)];
}

// Двойной range-слайдер <-> текстовые поля от/до — держим оба способа
// ввода в синхроне. Слайдер триггерит applyFilters только на отпускание
// (change), текстовое поле обновляется на каждое движение (input), чтобы
// не долбить сервер запросом на каждый пиксель протаскивания бегунка.
function wireRangeSlider(minRngId, maxRngId, minFieldId, maxFieldId) {
  const minRng = document.getElementById(minRngId), maxRng = document.getElementById(maxRngId);
  const minField = document.getElementById(minFieldId), maxField = document.getElementById(maxFieldId);
  minRng.addEventListener('input', () => {
    if (parseFloat(minRng.value) > parseFloat(maxRng.value)) maxRng.value = minRng.value;
    minField.value = minRng.value;
  });
  maxRng.addEventListener('input', () => {
    if (parseFloat(maxRng.value) < parseFloat(minRng.value)) minRng.value = maxRng.value;
    maxField.value = maxRng.value;
  });
  minRng.addEventListener('change', applyFilters);
  maxRng.addEventListener('change', applyFilters);
  // Ручной ввод в текстовое поле тоже двигает слайдер (в пределах его max).
  minField.addEventListener('change', () => { minRng.value = Math.min(parseFloat(minField.value) || 0, parseFloat(minRng.max)); });
  maxField.addEventListener('change', () => { maxRng.value = Math.min(parseFloat(maxField.value) || parseFloat(maxRng.max), parseFloat(maxRng.max)); });
}
wireRangeSlider('f-pmin-rng', 'f-pmax-rng', 'f-pmin', 'f-pmax');
wireRangeSlider('f-amin-rng', 'f-amax-rng', 'f-amin', 'f-amax');
// Цена в млн ₸ (продажа) или тыс ₸/мес (аренда) — у слайдера разный масштаб.
function reconfigurePriceSlider(type) {
  const max = type === 'rental' ? 500 : 200;
  document.getElementById('f-pmin-rng').max = max;
  document.getElementById('f-pmax-rng').max = max;
  if (parseFloat(document.getElementById('f-pmax-rng').value) > max) document.getElementById('f-pmax-rng').value = max;
}

function applyFilters() {
  applyFiltersSeq++;  // обрывает батчи предыдущего вызова (см. loadSaleBatch)
  const type = document.getElementById('f-type').value;
  reconfigurePriceSlider(type);
  document.getElementById('f-listing-filters').style.display = type === 'complex' ? 'none' : '';
  if (type === 'complex') {
    map.removeLayer(pointsLayer); map.removeLayer(topLayer); map.removeLayer(saleCluster);
    pointsLayer.clearLayers(); topLayer.clearLayers(); saleCluster.clearLayers();
    drawComplexLayer();
    return;
  } else {
    map.removeLayer(complexLayer); complexLayer.clearLayers();
  }
  const p = new URLSearchParams({type});
  const rooms = document.getElementById('f-rooms').value;
  // цена: принимаем и "25" (млн), и "25000000" (тенге); аренда — "300" (тыс) или "300000"
  const toTenge = v => {
    if (!(v > 0)) return 0;
    if (type === 'rental') return v >= 10000 ? Math.round(v) : Math.round(v * 1e3);
    return v >= 10000 ? Math.round(v) : Math.round(v * 1e6);
  };
  const pmin = toTenge(parseFloat(document.getElementById('f-pmin').value || 0));
  const pmax = toTenge(parseFloat(document.getElementById('f-pmax').value || 0));
  const amin = parseFloat(document.getElementById('f-amin').value || 0);
  const amax = parseFloat(document.getElementById('f-amax').value || 0);
  const ms = document.getElementById('f-score').value;
  if (rooms) p.set('rooms', rooms);
  if (pmin > 0) p.set('price_min', pmin);
  if (pmax > 0) p.set('price_max', pmax);
  if (amin > 0) p.set('area_min', amin);
  if (amax > 0) p.set('area_max', amax);
  if (ms && type === 'sale') p.set('min_score', ms);
  const seller = document.getElementById('f-seller').value;
  if (seller && type === 'sale') p.set('seller', seller);
  const market = document.getElementById('f-market').value;
  if (market && type === 'sale') p.set('market', market);
  const pricechange = document.getElementById('f-pricechange').value;
  if (pricechange && type === 'sale') p.set('price_change', pricechange);
  const finish = document.getElementById('f-finish').value;
  if (finish && type === 'sale') p.set('finish', finish);

  document.getElementById('f-market-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('f-score-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('f-pricechange-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('f-finish-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('f-price-label').textContent = type === 'rental' ? 'Цена (тыс ₸/мес или ₸)' : 'Цена (млн ₸ или ₸)';

  if (type === 'rental') {
  fetch('/admin/api/map-points?' + p.toString()).then(r => r.json()).then(d => {
      map.removeLayer(pointsLayer);
      map.removeLayer(topLayer);
      pointsLayer.clearLayers();
      topLayer.clearLayers();
      if (!map.hasLayer(saleCluster)) saleCluster.addTo(map);
      saleCluster.clearLayers();
      lastPoints = d.points || [];
      if (drawnPolygon) lastPoints = lastPoints.filter(pt => pointInPolygon(pt.lat, pt.lon, drawnPolygon));
      lastPoints.forEach(pt => {
        const pinHtml = buildPricePinHtml(pt, '#0077FF', false, '');
        const m = L.marker([pt.lat, pt.lon], {
          icon: L.divIcon({className:'', html: pinHtml, iconSize:[0,0], iconAnchor:[0,0]}),
          pinMeta: {pt, pinBg: '#0077FF', isTop: false},
        }).addTo(saleCluster);
        MINI_PIN_MARKERS[pt.id] = m;
        const cx = pt.complex ? `<a href="/admin/complex/find?name=${encodeURIComponent(pt.complex)}">${pt.complex}</a>` : 'ЖК не определён';
        let priceTrend = '';
        if (pt.prev_price && pt.prev_price !== pt.price) {
          const dp = (pt.price - pt.prev_price) / 1000;
          const dir = dp > 0;
          priceTrend = ` · <span style="color:${dir ? '#ef4444' : '#16a34a'};font-weight:700;">${dir ? '▲' : '▼'} ${Math.abs(dp).toFixed(0)} тыс${pt.price_changed ? ' ' + pt.price_changed : ''}</span>`;
        }
        m.bindPopup(`<div style="min-width:250px;"><b>Аренда: ${pt.price ? (pt.price/1000).toFixed(0) + ' тыс ₸/мес' : '—'}</b> · ${pt.rooms || '?'}-комн${priceTrend}<br>🏢 ${cx}<br><span style="color:#888;">привязка к карте: по ${pt.binding} (приблизительно)</span><br>найдено ${pt.found}${pt.url ? ' · <a href="' + pt.url + '" target="_blank">Крыша</a>' : ''}</div>`, {autoPan: false});
        m.on('popupopen', () => map.panTo([pt.lat, pt.lon], {animate: true}));
      });
      document.getElementById('result-count').textContent = lastPoints.length + ' на карте' + (d.no_geo ? ` (ещё ${d.no_geo} совсем без привязки)` : '') + (drawnPolygon ? ' · в области' : '');
      if (hexOn) drawHexGrid();
  });
    return;
  }
  // Продажа: объектов может быть 10-15 тыс. — вместо одного долгого запроса
  // (~5с) подгружаем батчами по BATCH шт., первый батч рисуется почти сразу,
  // остальное довозится в фоне без блокировки первой отрисовки карты.
  map.removeLayer(pointsLayer);
  pointsLayer.clearLayers();
  if (!map.hasLayer(saleCluster)) saleCluster.addTo(map);
  if (!map.hasLayer(topLayer)) topLayer.addTo(map);
  saleCluster.clearLayers();
  topLayer.clearLayers();
  lastPoints = [];
  topOnlyFilter = document.getElementById('f-top-only').checked;
  const BATCH = 300;
  const filterSeq = ++applyFiltersSeq;
  let loadTarget = null;
  const progWrap = document.getElementById('load-progress-wrap');
  const progBar = document.getElementById('load-progress-bar');
  const progLabel = document.getElementById('load-progress-label');
  progWrap.style.display = '';
  progBar.style.width = '0%';
  progLabel.textContent = 'загрузка…';
  function loadSaleBatch(offset) {
    if (filterSeq !== applyFiltersSeq) return;  // фильтры сменились — бросаем старую цепочку батчей
    const bp = new URLSearchParams(p);

      // фильтрах реальное число меньше, поэтому доводим до 100% в любом
      // случае, как только батчи закончились (has_more=false).
      if (d.coverage && d.coverage.total) loadTarget = d.coverage.total;

      progBar.style.width = pct + '%';
      progLabel.textContent = lastPoints.length.toLocaleString('ru') + (loadTarget ? ' / ' + loadTarget.toLocaleString('ru') : '') + ` (${pct}%)`;
      // Топ-10 всегда попадают в первый батч (ORDER BY eff_score DESC) —
      // при включённом фильтре остальные тысячи объектов грузить незачем.

}
function renderSaleBatch(d) {

    visiblePoints.forEach(pt => {

      const isTop = pt.top;

      const sellerTxt = pt.seller_name || (pt.is_owner ? 'собственник' : '');
      const pinHtml = buildPricePinHtml(pt, pinBg, isTop, sellerTxt);
      const m = L.marker([pt.lat, pt.lon], {
        icon: L.divIcon({className:'', html: pinHtml, iconSize:[0,0], iconAnchor:[0,0]}),

// Мини-график истории цены (SVG) — подгружается при открытии попапа.
// Значения точек — только по наведению (нативный <title> тултип браузера),
// в обычном виде линия без подписей (см. п.4 ТЗ).
function fmtMln(v) {
  const r = Math.round(v / 1e6 * 10) / 10;
  return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) + ' М';
}
function sparklineSVG(points, w, h) {
  if (points.length === 0) return '';
  // Подписи цен — под точками. Если точки стоят часто, соседние подписи
  // наезжают друг на друга — тогда разносим их в два яруса (через одну ниже)
  // и резервируем под это чуть больше места снизу.
  const labelTexts = points.map(p => fmtMln(p.price));
  const stepX0 = points.length > 1 ? w / (points.length - 1) : w;
  const estLabelW = Math.max(...labelTexts.map(t => t.length * 6.2 + 6));
  const crowded = stepX0 < estLabelW;
  const LABEL_H = crowded ? 26 : 16;  // место снизу под подписи точек
  const chartH = h - LABEL_H;
  const prices = points.map(p => p.price);
  const mn = Math.min(...prices), mx = Math.max(...prices);
  const span = mx - mn || 1;
  const stepX = points.length > 1 ? w / (points.length - 1) : 0;
  const coords = points.map((p, i) => [i * stepX, 3 + (chartH - 6) - ((p.price - mn) / span) * (chartH - 6)]);
  const path = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)},${chartH} L0,${chartH} Z`;
  const gid = 'sg' + Math.random().toString(36).slice(2, 9);
  const labels = coords.map((c, i) => {
    const x = Math.min(Math.max(c[0], 14), w - 14);  // не даём подписи вылезти за край
    const y = crowded && i % 2 === 1 ? h - 3 : chartH + 12;  // нижний ярус чуть ниже верхнего
    return `<text x="${x.toFixed(1)}" y="${y}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">${labelTexts[i]}</text>`;
  }).join('');
  const dots = coords.map((c, i) => {
    const p = points[i];
    return `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="8" fill="transparent" stroke="none" style="cursor:pointer;"><title>${p.at}: ${(p.price/1e6).toFixed(2)} млн ₸</title></circle>` +
           `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.5" style="pointer-events:none;"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" style="display:block;overflow:visible;">` +
         `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">` +
         `<stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>` +
         `<stop offset="100%" stop-color="#2563eb" stop-opacity="0.03"/></linearGradient></defs>` +
         `<path d="${areaPath}" fill="url(#${gid})" stroke="none"/>` +
         `<path d="${path}" fill="none" stroke="#2563eb" stroke-width="2"/>${dots}${labels}</svg>`;
}
function loadPriceHistory(id) {
  const el = document.getElementById('ph-' + id);
  if (!el || el.dataset.loaded) return;
  el.dataset.loaded = '1';
  fetch('/admin/api/price-history/' + encodeURIComponent(id)).then(r => r.json()).then(d => {
    // <=1 точка значит реальных изменений цены не было (только стартовая) — блок вообще не показываем
    if (!d.points || d.points.length <= 1) { el.innerHTML = ''; return; }
    const w = Math.max(220, el.clientWidth || 220);  // почти вся ширина карточки, а не фикс. 220px
    el.innerHTML = sparklineSVG(d.points, w, 58);
  }).catch(() => { el.innerHTML = ''; });
}

// Мини-карта с гексагонами в попапе: цена/м² продажи и аренды в гексагоне
// объявления и 6 смежных — переиспользует /admin/api/hex-prices (та же логика,
// что и на странице ЖК).
function drawHexPriceMini(divId, cells, valueField, fmt) {
  valueField = valueField || 'avg_m2';
  fmt = fmt || (v => Math.round(v/1000) + 'к/м²');
  const el = document.getElementById(divId);
  if (!el) return;
  if (!cells || !cells.length || !cells.some(c => c[valueField])) {
    el.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#888;font-size:10.5px;">нет данных</div>';
    return;
  }
  const self_ = cells.find(c => c.is_self);
  const hmap = L.map(divId, {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, touchZoom:false}).setView([self_.corners[0][0], self_.corners[0][1]], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {opacity:0.5}).addTo(hmap);
  const vals = cells.filter(c => c[valueField]).map(c => c[valueField]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const bounds = [];
  cells.forEach(c => {
    const v = c[valueField];
    const t = (hi > lo && v) ? (v - lo) / (hi - lo) : 0.5;
    const poly = L.polygon(c.corners, {
      color: c.is_self ? '#1e3a8a' : '#fff', weight: c.is_self ? 2 : 0.8,
      fillColor: v ? heatColor(t) : '#e5e7eb', fillOpacity: v ? 0.75 : 0.25,
    });
    if (v) {
      poly.bindTooltip(fmt(v), {permanent:true, direction:'center', className:'hex-price-label'});
    } else {
      poly.bindTooltip(`${c.label}: нет данных`, {sticky:true});
    }
    poly.addTo(hmap);
    c.corners.forEach(p => bounds.push(p));
  });
  hmap.fitBounds(bounds, {padding:[2,2]});
  setTimeout(() => hmap.invalidateSize(), 50);
}
function loadHexPriceMini(id, lat, lon, rooms) {
  const wrap = document.getElementById('hexwrap-' + id);
  if (!wrap || wrap.dataset.loaded || lat == null || lon == null) return;
  wrap.dataset.loaded = '1';
  wrap.innerHTML = `
<div style="font-size:10px;color:#888;margin-bottom:3px;">этот гексагон + 6 соседних</div>
<div style="display:flex;gap:6px;">
  <div style="flex:1;"><div style="font-size:28.5px;font-weight:800;text-align:center;">продажа рядом</div><div id="hexmini-sale-${id}" style="aspect-ratio:1/1;width:100%;border-radius:6px;"></div></div>
  <div style="flex:1;"><div style="font-size:28.5px;font-weight:800;text-align:center;">аренда рядом</div><div id="hexmini-rental-${id}" style="aspect-ratio:1/1;width:100%;border-radius:6px;"></div></div>
</div>`;
  const roomsQ = rooms ? `&rooms=${rooms}` : '';
  fetch(`/admin/api/hex-prices?lat=${lat}&lon=${lon}${roomsQ}`).then(r => r.json()).then(d => {
    drawHexPriceMini('hexmini-sale-' + id, d.sale, 'avg_m2', v => Math.round(v/1000) + 'к/м²');
    // Аренда — средняя ИТОГОВАЯ аренда квартиры такой же комнатности в
    // месяц (не ₸/м², который путали с итоговой ценой).
    drawHexPriceMini('hexmini-rental-' + id, d.rental, 'avg_price', v => Math.round(v/1000) + 'к/мес');
  }).catch(() => { wrap.innerHTML = ''; });
}

let lastPoints = [], hexOn = false, hexEdge = 50;
let applyFiltersSeq = 0;  // растёт при каждом applyFilters() — обрывает устаревшие цепочки батчей
let topOnlyFilter = false;  // чекбокс "⭐ Только топ-10 по скору" на главной карте
const hexLayer = L.layerGroup();
const LAT0 = 51.128, LON0 = 71.430,
      MLAT = 110574.0, MLON = 111320.0 * Math.cos(LAT0 * Math.PI/180);
function hexAxial(lat, lon, edge) {
  const x = (lon - LON0) * MLON, y = (lat - LAT0) * MLAT;
  let q = (Math.sqrt(3)/3 * x - y/3) / edge, r = (2/3 * y) / edge;
  const s = -q - r;
  let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const dq = Math.abs(rq-q), dr = Math.abs(rr-r), ds = Math.abs(rs-s);
  if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
  return [rq, rr];
}
function hexCenter(q, r, edge) {
  const x = edge * Math.sqrt(3) * (q + r/2), y = edge * 1.5 * r;
  return [LAT0 + y/MLAT, LON0 + x/MLON];
}
function hexCorners(q, r, edge) {
  const [clat, clon] = hexCenter(q, r, edge);
  const out = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI/180 * (60*i - 30);
    out.push([clat + (edge*Math.sin(a))/MLAT, clon + (edge*Math.cos(a))/MLON]);
  }
  return out;
}
function drawHexGrid() {
  hexLayer.clearLayers();
  const seen = new Set();
  lastPoints.forEach(p => {
    const [q, r] = hexAxial(p.lat, p.lon, hexEdge);
    const key = q + ':' + r;
    if (seen.has(key)) return;
    seen.add(key);
    // interactive:false — сетка чисто визуальная, клики проходят сквозь неё к маркерам
    L.polygon(hexCorners(q, r, hexEdge), {color:'#8b5cf6', weight:1, fillOpacity:0.06, interactive:false}).addTo(hexLayer);
  });
  hexLayer.addTo(map);
}
// ── Тепловые карты (hexbin): цены продажи/аренды, школы, шум по полосам ───
const HEAT_EDGE_M = 250;  // крупнее, чем гекс-сетка скоринга — это обзорный слой города
const NOISE_EDGE_M = 30;  // шум — более мелкая сетка, ближе к масштабу отдельного дома/квартала
const heatLayer = L.layerGroup();
let heatMode = null;
let heatCache = {sale: null, rental: null, schools: null, noise: null};

// Расширенная палитра: зелёный (дёшево/тихо) -> жёлто-зелёный -> жёлтый ->
// оранжевый -> красный -> бордовый (дорого/шумно) — 6 стопов вместо 2,
// чтобы верхний край шкалы (самые дорогие/шумные гексы) отличался от
// середины, а не сливался в один и тот же красный.
const HEAT_STOPS = [
  [22, 163, 74],   // #16a34a зелёный
  [132, 204, 22],  // #84cc16 жёлто-зелёный
  [234, 179, 8],   // #eab308 жёлтый
  [249, 115, 22],  // #f97316 оранжевый
  [239, 68, 68],   // #ef4444 красный
  [127, 29, 29],   // #7f1d1d бордовый
];
function heatColor(t) {
  // t: 0 (зелёный, дёшево/тихо) .. 1 (бордовый, дорого/шумно)
  t = Math.max(0, Math.min(1, t));
  const n = HEAT_STOPS.length - 1;
  const pos = t * n;
  const i = Math.min(Math.floor(pos), n - 1);
  const frac = pos - i;
  const from = HEAT_STOPS[i], to = HEAT_STOPS[i + 1];
  const c = from.map((f, k) => Math.round(f + (to[k] - f) * frac));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function hexBucket(items, latLonFn, edge) {
  edge = edge || HEAT_EDGE_M;
  const buckets = new Map();
  items.forEach(it => {
    const [lat, lon] = latLonFn(it);
    if (lat == null || lon == null) return;
    const [q, r] = hexAxial(lat, lon, edge);
    const key = q + ':' + r;
    if (!buckets.has(key)) buckets.set(key, {q, r, items: []});
    buckets.get(key).items.push(it);
  });
  return buckets;
}

function median(arr) {
  const s = [...arr].sort((a,b) => a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function drawPriceHeat(points, archivedPoints) {
  const buckets = hexBucket(points.filter(p => p.price > 0), p => [p.lat, p.lon]);
  // Гексагоны без активных объявлений — подстрахуем последними ценами
  // проданного (архив), вместо того чтобы оставлять клетку пустой.
  if (archivedPoints && archivedPoints.length) {
    const archBuckets = hexBucket(archivedPoints.filter(p => p.price > 0), p => [p.lat, p.lon]);
    archBuckets.forEach((b, key) => {
      if (!buckets.has(key)) { b.isArchived = true; buckets.set(key, b); }
    });
  }
  const medians = [];
  buckets.forEach(b => { b.value = median(b.items.map(i => i.price)); medians.push(b.value); });
  if (!medians.length) return;
  const lo = percentile(medians, 0.10), hi = percentile(medians, 0.90);
  buckets.forEach(b => {
    const t = hi > lo ? (b.value - lo) / (hi - lo) : 0.5;
    const priceTxt = b.value >= 1e6 ? (b.value/1e6).toFixed(1) + ' М' : (b.value/1e3).toFixed(0) + 'K';
    // По комнатности — если есть данные по рукам (rooms), покажем разбивку
    const byRooms = {};
    b.items.forEach(i => { if (i.rooms) (byRooms[i.rooms] = byRooms[i.rooms] || []).push(i.price); });
    const roomsTxt = Object.keys(byRooms).sort().map(rm => {
      const med = median(byRooms[rm]);
      const t2 = med >= 1e6 ? (med/1e6).toFixed(1) + 'М' : (med/1e3).toFixed(0) + 'K';
      return `${rm}к: ${t2}`;
    }).join(' · ');
    const archNote = b.isArchived ? ' (по последним продажам, архив)' : '';
    L.polygon(hexCorners(b.q, b.r, HEAT_EDGE_M), {
      color: b.isArchived ? '#8b5cf6' : '#fff', weight: b.isArchived ? 1.2 : 0.5,
      dashArray: b.isArchived ? '3,3' : null,
      fillColor: heatColor(t), fillOpacity: 0.55,
    }).bindTooltip(`медиана: ${priceTxt} ₸ · ${b.items.length} объявл.${archNote}${roomsTxt ? '<br>' + roomsTxt : ''}`, {sticky:true}).addTo(heatLayer);
  });
}

function drawCountHeat(items, latLonFn, label) {
  const buckets = hexBucket(items, latLonFn);
  const counts = [];
  buckets.forEach(b => { b.value = b.items.length; counts.push(b.value); });
  if (!counts.length) return;
  const hi = Math.max(...counts);
  buckets.forEach(b => {
    const t = hi > 0 ? b.value / hi : 0;
    L.polygon(hexCorners(b.q, b.r, HEAT_EDGE_M), {
      color: '#fff', weight: 0.5, fillColor: heatColor(t), fillOpacity: 0.5,
    }).bindTooltip(`${label}: ${b.value}`, {sticky:true}).addTo(heatLayer);
  });
}

// Базовый рейтинг шума участка дороги: магистраль (motorway/trunk) — 30
// всегда, иначе по числу полос: 3+ полосы — 20, 2 (или меньше/неизвестно) — 10.
function roadNoiseScore(r) {
  if (r.highway === 'motorway' || r.highway === 'trunk') return 30;
  if ((r.lanes || 0) >= 3) return 20;
  return 10;
}

// Соседи гекса в осевых координатах — для распространения шума от гексов
// с дорогами на соседние (там, где стоят ЖК рядом с дорогой, но сам гекс
// дороги не содержит).
const HEX_DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function hexNeighborsAxial(q, r) {
  return HEX_DIRS.map(([dq, dr]) => [q + dq, r + dr]);
}

function drawRoadHeat(roads) {
  const buckets = hexBucket(roads, r => [r.lat, r.lon], NOISE_EDGE_M);
  // Базовый скор гекса = сумма скорингов дорог в нём + бонус за пересечение
  // (2+ разных участка дороги рядом друг с другом в одном 30м гексе —
  // приближение: точных координат пересечений в данных нет, у нас только
  // одна точка-центр на весь отрезок дороги из OSM).
  const base = new Map();
  buckets.forEach((b, key) => {
    let score = b.items.reduce((s, i) => s + roadNoiseScore(i), 0);
    if (b.items.length >= 2) score += 10;  // пересечение (приближённо)
    base.set(key, {q: b.q, r: b.r, score, isRoad: true, roadCount: b.items.length});
  });
  // Распространяем на 1 кольцо соседей с затуханием, чтобы гексы РЯДОМ с
  // дорогой (не только сами дорожные) тоже получили оценку шума — именно
  // там чаще всего стоят жилые комплексы. Дальше 1 кольца не идём —
  // при ~2700 точках дорог даже так получается 15-20 тыс. полигонов,
  // это уже граница комфортной отрисовки в браузере.
  const DECAY = [1, 0.55];  // сам гекс, кольцо 1
  const spread = new Map(base);
  let frontier = [...base.values()];
  for (let ring = 1; ring <= 1; ring++) {
    const next = [];
    frontier.forEach(cell => {
      hexNeighborsAxial(cell.q, cell.r).forEach(([nq, nr]) => {
        const nkey = nq + ':' + nr;
        const propagated = (base.get(cell.q + ':' + cell.r)?.score ?? cell.score) * DECAY[ring];
        const existing = spread.get(nkey);
        if (!existing || existing.score < propagated) {
          const cellData = {q: nq, r: nr, score: propagated, isRoad: false, roadCount: 0};
          spread.set(nkey, cellData);
          next.push(cellData);
        }
      });
    });
    frontier = next;
  }
  const scores = [...spread.values()].map(c => c.score);
  if (!scores.length) return;
  const hi = percentile(scores, 0.90) || Math.max(...scores);
  spread.forEach(c => {
    const t = hi > 0 ? c.score / hi : 0;
    L.polygon(hexCorners(c.q, c.r, NOISE_EDGE_M), {
      color: '#fff', weight: 0.4, fillColor: heatColor(t), fillOpacity: c.isRoad ? 0.55 : 0.35,
    }).bindTooltip(
      c.isRoad
        ? `шум: ${c.score.toFixed(0)} (${c.roadCount} уч. дорог${c.roadCount >= 2 ? ' · пересечение' : ''})`
        : `шум (по соседству с дорогой): ~${c.score.toFixed(0)}`,
      {sticky:true}
    ).addTo(heatLayer);
  });
}

async function loadHeatData(mode) {
  if (heatCache[mode]) return heatCache[mode];
  if (mode === 'sale') {
    const [d, archived] = await Promise.all([
      (await fetch('/admin/api/map-points?type=sale')).json(),
      (await fetch('/admin/api/archived-sale-points')).json(),
    ]);
    heatCache.sale = d.points || [];
    heatCache.saleArchived = archived.points || [];
  } else if (mode === 'rental') {
    const d = await (await fetch('/admin/api/map-points?type=rental')).json();
    heatCache.rental = d.points || [];
  } else if (mode === 'schools') {
    const d = await (await fetch('/admin/api/city-poi')).json();
    heatCache.schools = (d.poi || []).filter(p => p.kind === 'school' || p.kind === 'kindergarten');
  } else if (mode === 'noise') {
    const d = await (await fetch('/admin/api/city-roads')).json();
    heatCache.noise = d.roads || [];
  }
  return heatCache[mode];
}

async function toggleHeat(mode) {
  const btn = document.querySelector(`.heat-btn[data-mode="${mode}"]`);
  if (heatMode === mode) {
    // повторный клик по активной — выключить
    heatMode = null;
    map.removeLayer(heatLayer);
    heatLayer.clearLayers();
    document.querySelectorAll('.heat-btn').forEach(b => { b.style.background = 'var(--bg)'; b.style.color = 'var(--text)'; });
    return;
  }
  document.querySelectorAll('.heat-btn').forEach(b => { b.style.background = 'var(--bg)'; b.style.color = 'var(--text)'; });
  if (btn) { btn.style.background = '#2563eb'; btn.style.color = '#fff'; }
  heatMode = mode;
  heatLayer.clearLayers();
  if (!map.hasLayer(heatLayer)) heatLayer.addTo(map);
  const data = await loadHeatData(mode);
  if (heatMode !== mode) return;  // успели переключиться, пока грузилось
  if (mode === 'sale' || mode === 'rental') drawPriceHeat(data, mode === 'sale' ? heatCache.saleArchived : null);
  else if (mode === 'schools') drawCountHeat(data, p => [p.lat, p.lon], 'школ/садиков');
  else if (mode === 'noise') drawRoadHeat(data);
}

function toggleHexGrid() {
  hexOn = !hexOn;
  const b = document.getElementById('hex-toggle');
  if (hexOn) { drawHexGrid(); b.textContent = '⬡ Гекс-сетка: вкл (' + hexEdge + 'м)'; }
  else { map.removeLayer(hexLayer); b.textContent = '⬡ Гекс-сетка: выкл'; }
}

      if (mainImg) mainImg.onclick = () => { carIdx[id] = modalPhotoIdx; openLightbox(id, event); };
    }

    if (d.lat != null && d.lon != null) loadHexPriceMini('modal', d.lat, d.lon, d.rooms);

    fetch('/admin/api/price-history/' + encodeURIComponent(id)).then(r => r.json()).then(dh => {
      const wrap = document.getElementById('modal-price-history-wrap');
      const el = document.getElementById('modal-price-history');
      if (!el || !wrap) return;
      // <=1 точка = цена не менялась — блок не показываем вообще
      if (!dh.points || dh.points.length <= 1) return;
      wrap.style.display = '';
      el.innerHTML = sparklineSVG(dh.points, 420, 78) + '<div style="font-size:12px;color:#aaa;margin-top:2px;">наведи на точку — точная дата</div>';
    }).catch(() => {});
  }).catch(() => {
    content.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#888;">Ошибка загрузки</div>';
  });
}

function closeDetailModal() {
  const root = document.getElementById('detail-modal-overlay');
  if (root) root.style.display = 'none';
  modalListingId = null;
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalListingId) closeDetailModal();
});

applyFilters();

const poiLayer = L.layerGroup();
let poiLoaded = false, poiOn = false;
document.getElementById('btn-schools').addEventListener('click', function() {
  poiOn = !poiOn;
  this.style.background = poiOn ? '#2563eb' : '#fff';
  this.style.color = poiOn ? '#fff' : '#2563eb';
  if (poiOn) {
    if (!poiLoaded) {
      fetch('/admin/api/city-poi').then(r => r.json()).then(d => {
        // Яркие контрастные бейджи вместо голых эмодзи — иначе теряются на фоне карты
        const poiStyle = {
          school:       {icon:'🏫', bg:'#f97316'},
          kindergarten: {icon:'🧸', bg:'#ec4899'},
        };
        d.poi.forEach(p => {
          const st = poiStyle[p.kind] || {icon:'🎓', bg:'#0ea5e9'};
          L.marker([p.lat, p.lon], {icon: L.divIcon({className:'', html:
            `<div style="width:48px;height:48px;border-radius:50%;background:${st.bg};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:26px;">${st.icon}</div>`,
            iconSize:[48,48], iconAnchor:[24,24]})})
            .bindTooltip(`${st.icon} ${p.name || p.kind}${p.address ? '<br>' + p.address : ''}`).addTo(poiLayer);
        });
        poiLoaded = true;
      });
    }
    poiLayer.addTo(map);
  } else { map.removeLayer(poiLayer); }
});
</script>
{% endblock %}
