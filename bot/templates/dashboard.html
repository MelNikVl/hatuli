{% extends "base.html" %}
{% block content %}
{% set admin = is_admin(request) %}
<div class="page-title">Карта предложений Астаны</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Фильтры -->
<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">
  <div><label style="font-size:11px;color:#888;display:block;">Тип</label>
    <select id="f-type" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="sale">Продажа</option><option value="rental">Аренда</option>
    </select></div>
  <div><label style="font-size:11px;color:#888;display:block;">Комнат</label>
    <select id="f-rooms" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
      <option value="">любые</option><option>1</option><option>2</option><option>3</option><option>4</option>
    </select></div>
  <div><label style="font-size:11px;color:#888;display:block;">Цена от, млн ₸</label>
    <input id="f-pmin" type="number" min="0" step="1" style="width:90px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);"></div>
  <div><label style="font-size:11px;color:#888;display:block;">Цена до, млн ₸</label>
    <input id="f-pmax" type="number" min="0" step="1" style="width:90px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);"></div>
  <div id="f-score-wrap"><label style="font-size:11px;color:#888;display:block;">Мин. скор</label>
    <input id="f-score" type="number" min="0" max="100" step="5" style="width:80px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);"></div>
  {% if admin %}
  <label style="font-size:13px;cursor:pointer;padding-bottom:8px;"><input type="checkbox" id="poi-toggle"> 🏫 школы/садики</label>
  {% endif %}
  <button onclick="applyFilters()" style="padding:9px 26px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Показать</button>
  <span id="result-count" style="font-size:12px;color:#888;padding-bottom:9px;"></span>
  {% if admin %}<span id="map-coverage" style="font-size:12px;color:#888;padding-bottom:9px;"></span>{% endif %}
</div>

<!-- Карта (продажа) -->
<div id="map-wrap" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;">
  <div id="objects-map" style="height:520px;border-radius:8px;"></div>
</div>

<!-- Список (аренда — координат нет, показываем свежие предложения) -->
<div id="rental-wrap" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;">
  <p style="font-size:12px;color:#888;margin-top:0;">Свежие предложения аренды за 7 дней (у аренды нет координат — карта недоступна).</p>
  <table style="width:100%;border-collapse:collapse;font-size:13px;" id="rental-table"></table>
</div>

<script>
const map = L.map('objects-map').setView([51.128, 71.43], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OSM'}).addTo(map);
const pointsLayer = L.layerGroup().addTo(map);

function scoreColor(s, p10, p90) {
  const t = p90 > p10 ? Math.max(0, Math.min(1, (s - p10) / (p90 - p10))) : 0.5;
  const from = [156,163,175], to = [22,163,74];
  const c = from.map((f,i) => Math.round(f + (to[i]-f)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function percentile(arr, p) {
  const s = [...arr].sort((a,b) => a-b);
  return s[Math.min(Math.floor(s.length * p), s.length - 1)];
}

function applyFilters() {
  const type = document.getElementById('f-type').value;
  const p = new URLSearchParams({type});
  const rooms = document.getElementById('f-rooms').value;
  const pmin = parseFloat(document.getElementById('f-pmin').value || 0) * 1e6;
  const pmax = parseFloat(document.getElementById('f-pmax').value || 0) * 1e6;
  const ms = document.getElementById('f-score').value;
  if (rooms) p.set('rooms', rooms);
  if (pmin > 0) p.set('price_min', pmin);
  if (pmax > 0) p.set('price_max', pmax);
  if (ms && type === 'sale') p.set('min_score', ms);

  document.getElementById('map-wrap').style.display = type === 'sale' ? '' : 'none';
  document.getElementById('rental-wrap').style.display = type === 'rental' ? '' : 'none';
  document.getElementById('f-score-wrap').style.display = type === 'sale' ? '' : 'none';

  fetch('/admin/api/map-points?' + p.toString()).then(r => r.json()).then(d => {
    if (type === 'rental') {
      const rows = (d.rentals || []).map(r =>
        `<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:6px 8px;"><a href="${r.url}" target="_blank">${r.complex || 'ЖК не определён'}</a></td>
          <td style="padding:6px 8px;">${r.rooms || '?'}-комн</td>
          <td style="padding:6px 8px;"><b>${r.price ? (r.price/1000).toFixed(0) + ' тыс ₸/мес' : '—'}</b></td>
          <td style="padding:6px 8px;color:#888;">${r.found}</td>
        </tr>`).join('');
      document.getElementById('rental-table').innerHTML =
        '<tr style="text-align:left;color:#888;"><th style="padding:6px 8px;">ЖК</th><th style="padding:6px 8px;">Комнат</th><th style="padding:6px 8px;">Цена</th><th style="padding:6px 8px;">Найдено</th></tr>' + rows;
      document.getElementById('result-count').textContent = d.count + ' объявлений';
      return;
    }
    pointsLayer.clearLayers();
    const scores = d.points.map(pt => pt.score);
    const p10 = percentile(scores, 0.10), p90 = percentile(scores, 0.90);
    d.points.forEach(pt => {
      let m;
      if (pt.top) {
        m = L.marker([pt.lat, pt.lon], {icon: L.divIcon({className:'', html:'<div style="font-size:22px;line-height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));">❤️</div>', iconSize:[22,22], iconAnchor:[11,11]}), zIndexOffset:1000}).addTo(pointsLayer);
      } else {
        m = L.circleMarker([pt.lat, pt.lon], {radius:6, fillColor:scoreColor(pt.score,p10,p90), color:'#fff', weight:1, fillOpacity:.85}).addTo(pointsLayer);
      }
      const priceM = pt.price ? (pt.price/1e6).toFixed(1) + ' млн ₸' : '—';
      const ageText = pt.age === 0 ? 'сегодня' : pt.age + ' дн.';
      m.bindPopup(`<b>Скор: ${pt.score}</b> · ${pt.rooms || '?'}-комн, ${pt.area || '?'} м²<br>${priceM} · на рынке ${ageText}<br>${pt.complex ? '🏢 ' + pt.complex : '🏢 ЖК не определён'}<br>${pt.address ? '📍 ' + pt.address + '<br>' : ''}<a href="/admin/analytics/${pt.id}">Карточка</a> · <a href="${pt.url}" target="_blank">Крыша</a>`);
    });
    document.getElementById('result-count').textContent = d.count + ' объектов';
    const cov = document.getElementById('map-coverage');
    if (cov && d.coverage) {
      const pct = d.coverage.total ? Math.round(100*d.coverage.with_coords/d.coverage.total) : 0;
      cov.textContent = `· с координатами ${d.coverage.with_coords} из ${d.coverage.total} (${pct}%)`;
    }
  });
}
applyFilters();

{% if admin %}
const poiLayer = L.layerGroup();
let poiLoaded = false;
document.getElementById('poi-toggle').addEventListener('change', function() {
  if (this.checked) {
    if (!poiLoaded) {
      fetch('/admin/api/city-poi').then(r => r.json()).then(d => {
        d.poi.forEach(p => {
          const icon = p.kind === 'school' ? '🏫' : p.kind === 'kindergarten' ? '🧸' : '🎓';
          L.marker([p.lat, p.lon], {icon: L.divIcon({className:'', html:`<div style="font-size:14px;opacity:.85;">${icon}</div>`, iconSize:[14,14], iconAnchor:[7,7]})})
            .bindTooltip(`${icon} ${p.name || p.kind}${p.address ? '<br>' + p.address : ''}`).addTo(poiLayer);
        });
        poiLoaded = true;
      });
    }
    poiLayer.addTo(map);
  } else { map.removeLayer(poiLayer); }
});
{% endif %}
</script>
{% endblock %}
