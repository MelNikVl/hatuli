<style>
  /* Рыночная аналитика — презентационный стиль Clearly (задача 2026-08-21).
     Скоупим акцент локально (--mkt-*), НЕ трогаем глобальный --accent
     (#5865f2) остального админ-панели — переопределение только внутри
     .mkt-dashboard. */
  .mkt-dashboard {
    --mkt-accent: #94ccd1;
    --mkt-accent-dark: #5fa8ae;
    --mkt-green: var(--green, #2ecc71);
    --mkt-red: var(--red, #e74c3c);
    --mkt-muted: var(--muted, #8892b0);
    max-width: 1880px;
    margin: 0 auto;
    padding: 0 4px 40px;
  }
  .mkt-header { margin: 4px 0 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .mkt-header h1 { font-size: 26px; font-weight: 800; color: var(--text); margin: 0 0 4px; letter-spacing: -0.01em; }
  .mkt-header .mkt-subtitle { font-size: 14.5px; color: var(--mkt-muted); margin: 0; max-width: 720px; line-height: 1.5; }
  .mkt-freshness { font-size: 12px; color: var(--mkt-muted); white-space: nowrap; text-align: right; }
  .mkt-freshness b { color: var(--text); font-weight: 600; }

  .mkt-presentation-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    border-radius: 10px; border: 1px solid var(--mkt-accent); background: transparent;
    color: var(--mkt-accent-dark); font-size: 13px; font-weight: 700; cursor: pointer;
    text-decoration: none; white-space: nowrap;
  }
  .mkt-presentation-btn:hover { background: var(--mkt-accent); color: #08282b; }
  :root:not([data-theme="light"]) .mkt-presentation-btn { color: var(--mkt-accent); }
  :root:not([data-theme="light"]) .mkt-presentation-btn:hover { color: #08282b; }

  /* ── Инфобокс (страница поглощения) ─────────────────────────────── */
  .mkt-disclaimer {
    background: color-mix(in srgb, var(--mkt-accent) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--mkt-accent) 45%, var(--border));
    border-radius: 12px; padding: 14px 18px; margin: 0 0 22px; font-size: 13.5px;
    color: var(--text); line-height: 1.55; display:flex; gap: 10px; align-items:flex-start;
  }
  .mkt-disclaimer .ico { font-size: 18px; line-height: 1; flex-shrink:0; }

  /* ── Фильтры ─────────────────────────────────────────────────────── */
  .mkt-filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 22px;
  }
  .mkt-filters .fld { display:flex; flex-direction:column; gap:4px; min-width: 128px; }
  .mkt-filters label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--mkt-muted); }
  .mkt-filters select {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; min-width: 120px;
  }
  .mkt-filters select:focus { outline: 2px solid var(--mkt-accent); outline-offset: -1px; }
  .mkt-filters .mkt-reset { font-size: 12px; color: var(--mkt-muted); text-decoration: none; padding: 8px 4px; }
  .mkt-filters .mkt-reset:hover { color: var(--text); }

  /* ── KPI-карточки ────────────────────────────────────────────────── */
  .mkt-kpi-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 26px;
  }
  @media (max-width: 1400px) { .mkt-kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  .mkt-kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; position: relative; min-height: 108px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .mkt-kpi .lbl { font-size: 12px; color: var(--mkt-muted); font-weight: 600; display:flex; align-items:center; gap:5px; }
  .mkt-kpi .val { font-size: 27px; font-weight: 800; color: var(--text); margin: 6px 0 2px; line-height: 1.1; letter-spacing:-0.01em; }
  .mkt-kpi .val .unit { font-size: 14px; font-weight: 600; color: var(--mkt-muted); margin-left: 4px; }
  .mkt-kpi .chg { font-size: 12.5px; font-weight: 700; display:inline-flex; align-items:center; gap:3px; }
  .mkt-kpi .chg.up { color: var(--mkt-green); }
  .mkt-kpi .chg.down { color: var(--mkt-red); }
  .mkt-kpi .chg.flat, .mkt-kpi .chg.na { color: var(--mkt-muted); font-weight: 600; }
  .mkt-kpi .tip-ico {
    width: 15px; height: 15px; border-radius: 50%; background: var(--border); color: var(--mkt-muted);
    font-size: 10px; display:inline-flex; align-items:center; justify-content:center; cursor: help; flex-shrink:0;
  }
  .mkt-kpi .tip-ico:hover { background: var(--mkt-accent); color: #08282b; }
  .mkt-kpi[data-tip] { position: relative; }
  .mkt-kpi .tip-ico[title] { position: relative; }

  /* Нативный title даёт браузерный tooltip — presentation-friendly,
     без JS. Расширенный текст ограничений подписан мелко под значением. */
  .mkt-kpi .lim { font-size: 10.5px; color: var(--mkt-muted); margin-top: 4px; line-height: 1.3; }

  /* ── Графики ─────────────────────────────────────────────────────── */
  .mkt-chart-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px 14px; margin-bottom: 20px;
  }
  .mkt-chart-panel h3 { font-size: 15.5px; font-weight: 700; color: var(--text); margin: 0 0 2px; display:flex; align-items:center; gap:8px; }
  .mkt-chart-panel .mkt-note { font-size: 12px; color: var(--mkt-muted); margin: 0 0 12px; line-height: 1.4; }
  .mkt-chart-panel .mkt-canvas-wrap { position: relative; width: 100%; }
  .mkt-row-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 1500px) { .mkt-row-2 { grid-template-columns: 1fr; } }
  .mkt-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1500px) { .mkt-row-3 { grid-template-columns: 1fr; } }

  .mkt-seg-toggle { display:flex; gap:6px; margin-bottom: 12px; flex-wrap: wrap; }
  .mkt-seg-toggle button {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .mkt-seg-toggle button.active { background: var(--mkt-accent); border-color: var(--mkt-accent); color: #08282b; }

  .mkt-insufficient {
    display:flex; align-items:center; justify-content:center; height: 200px; color: var(--mkt-muted);
    font-size: 13.5px; text-align:center; padding: 20px;
  }

  /* ── Таблица сегментов ───────────────────────────────────────────── */
  .mkt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mkt-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .02em;
    color: var(--mkt-muted); font-weight: 700; padding: 8px 10px; border-bottom: 2px solid var(--border); }
  .mkt-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
  .mkt-table tr:hover td { background: color-mix(in srgb, var(--mkt-accent) 6%, transparent); }
  .mkt-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mkt-table .insufficient-row td { color: var(--mkt-muted); font-style: italic; }
  .mkt-badge-insufficient { font-size: 10.5px; padding: 1px 6px; border-radius: 8px; background: var(--border); color: var(--mkt-muted); margin-left: 6px; }

  /* ── Режим презентации: ?presentation=1 ─────────────────────────── */
  body.mkt-presentation-mode .atabs,
  body.mkt-presentation-mode .pub-header,
  body.mkt-presentation-mode .pub-nav,
  body.mkt-presentation-mode .mkt-admin-only { display: none !important; }
  body.mkt-presentation-mode .mkt-dashboard { max-width: 100%; padding: 24px 32px 50px; }
  body.mkt-presentation-mode .mkt-header h1 { font-size: 34px; }
  body.mkt-presentation-mode .mkt-header .mkt-subtitle { font-size: 16px; }
  body.mkt-presentation-mode .mkt-kpi .val { font-size: 33px; }
  body.mkt-presentation-mode .mkt-kpi { padding: 20px 22px; min-height: 128px; }
  body.mkt-presentation-mode .mkt-chart-panel { padding: 24px 26px 18px; }
  body.mkt-presentation-mode .mkt-chart-panel h3 { font-size: 18px; }
  body.mkt-presentation-mode .mkt-filters { opacity: .92; }
</style>
